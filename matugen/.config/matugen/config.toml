# matugen - renders every generated colour file on the desktop
#
# Triggered by ~/.local/bin/wallpaper-switch. Only the ACCENTS are derived from
# the image. The BASE -- surfaces, text, outlines, the sixteen ANSI slots, the
# alert colours -- comes from the scheme file `desktop-scheme` hands the same
# render through `--import-json`, so what guarantees contrast is a palette
# checked once, by hand, when the scheme is written, rather than a base nobody
# could change. Both halves reach every template out of one render.
#
# Waybar, wofi and dunst were here. All three are gone: the shell draws the
# bar, the launcher and the notifications now, and it reads the palette live
# from colors.json instead of having files regenerated for it.
#
# Template syntax: {{colors.<role>.default.hex}}
#
# A render offers 128 roles and they come from the two halves above -- measured
# on 4.2.0 by dumping one:
#
#   $ matugen color hex '#7aa2f7' -j hex --dry-run --mode dark \
#       --import-json schemes/tokyo-night.json | jq '.colors | keys | length'
#
# 50 of them are the unprefixed Material 3 roles matugen derives from the
# accent -- primary, secondary, tertiary, source_color, error, outline and the
# containers and `on_` partners around them -- and 78 are the prefixed ones the
# scheme file carries: ui_* for surfaces and text, term_* for the terminal,
# sem_* for the alerts, fb_* for the accent a fresh clone falls back to.
# schemes/README.md is the authority on what each of those 78 means; a template
# that wants one it does not name is a template asking for a role no scheme has
# to fill.

# [config] IS EMPTY AND MUST STILL BE HERE. Every option that used to live
# under it is gone (see the block below), but matugen deserialises the file
# into a struct whose `config` field is not optional, so deleting the header
# is a hard failure before any template is even looked at:
#
#   $ matugen image w.jpg -c config.toml
#   Failed to read config file.
#   TOML parse error at line 1, column 1  --  missing field `config`
#
# Verified against matugen 4.2.0 by removing the line and running it.
[config]

# ---- There is NO [config.custom_colors]: do not add one back ----
#
# There was one, and it harmonised three extra colours on every wallpaper
# change -- cpu #bb9af7, ram #9ece6a, gpu #7aa2f7, each with blend = true so
# matugen rotated the Tokyo Night hue towards the image (Material You's
# harmonize) instead of replacing it. The argument was that the three
# segments of #custom-system have to be told apart at a glance, and that
# assigning them scheme roles would collapse two of them into each other over
# a green wallpaper.
#
# #custom-system IS A WAYBAR CSS ID, and waybar is gone -- the shell draws
# that readout now (see the note at the top of this file). Nothing took over
# the three colours when the bar went:
#
#   $ git grep -E 'colors\.(cpu|ram|gpu)'    -> nothing, in the whole tree
#
# None of the fourteen templates below reads them, so matugen was computing
# three harmonised hues per wallpaper and writing them into no file at all.
# The one thing that looks like a hit is not one: templates/
# fastfetch-config.jsonc contains "type": "cpu", which names a fastfetch
# MODULE and has nothing to do with a colour role.
#
# The replacement does not want them either. quickshell/Theme.qml takes its
# accents from `primary` and `secondary`, which the scheme already provides
# in contrast-checked pairs; two hand-harmonised hues outside that system
# would be two more things to keep in step for no gain.
#
# WHAT THE BLOCK WAS RIGHT ABOUT stays true and is now stated where it
# applies: an ALERT is never harmonised. A warning has to read as "watch out"
# and a critical as "something is wrong" over a red wallpaper as over a blue
# one, because for those two the colour IS the meaning.
#
# WHAT THAT MEANT WAS "NOT THE IMAGE", AND IT WAS READ AS "HARDCODED". The two
# were the same thing while Tokyo Night's #e0af68 and #f7768e were literals in
# Theme.qml and in both GTK templates; they stopped being the same thing when
# the scheme arrived. A scheme is not a wallpaper -- it is picked by hand and
# moves only when the user moves it -- so an alert taken from one is as fixed
# as anything on screen. Every alert on the desktop now comes from the scheme's
# sem_* roles: sem_warning / sem_critical and their `on_` partners, read by the
# GTK templates, zathura, qt6ct, cship and (through colors.json) Theme.qml.
# What has NOT changed is the reason M3's `error` role is still refused --
# quickshell-colors.json passes neither error nor on_error, because that one IS
# derived per image and would tint a critical the hue of the picture.

# ---- Quickshell (the shell: bar, notifications, launcher, dashboard) ----
# JSON and not a generated .qml on purpose: Quickshell reloads the WHOLE
# config when any .qml changes, so a generated QML file would restart the
# shell on every wallpaper change. Theme.qml reads this file through a
# FileView with watchChanges, which updates the accents in place and lets
# them fade along with the wallpaper.
#
# No post_hook for the same reason: nothing has to be signalled or reloaded.
[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.json'
output_path = '~/.config/quickshell/colors.json'

# ---- Kitty ----
# TWO templates, and the split is base vs accent rather than two apps.
#
# kitty-scheme.conf carries the 16 ANSI slots, the foreground and the background
# -- the half that decides whether the terminal reads as Tokyo Night or as
# Gruvbox, and the half every TUI in the session inherits through those sixteen
# slots. kitty-colors.conf carries what the wallpaper decides: cursor,
# selection, tabs, links, the active border.
#
# kitty.conf includes scheme.conf FIRST and colors.conf after it. kitty applies
# an include where it meets it and the last setting of a name wins, so that
# order is what lets the accents paint over the base instead of the other way
# round.
#
# THE SAME post_hook ON BOTH, and that is not redundancy. matugen does not
# render templates in the order this file declares them -- measured on 4.2.0
# with three templates and a logging hook: the order changed between runs of the
# same command, and each post_hook fires immediately after its own template
# rather than after all of them. With the hook on only one of the two, whichever
# run signals kitty first leaves the terminal holding half of the new theme.
[templates.kitty-scheme]
input_path = '~/.config/matugen/templates/kitty-scheme.conf'
output_path = '~/.config/kitty/scheme.conf'
post_hook = 'pkill -SIGUSR1 -x kitty || true'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR1 -x kitty || true'

# ---- Hyprland ----
# A Lua table that hyprland.lua reads at startup. The live change is done by
# wallpaper-switch through hyprctl, without reloading the whole config.
[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.config/hypr/colors.lua'

# ---- niri ----
# The same two accents for the other compositor flavor, and BOTH are rendered on
# every wallpaper change regardless of which one is running. That is deliberate:
# matugen has no idea what is on screen, and generating only the live flavor
# would leave the other one showing the accent of whatever wallpaper was up the
# last time it was booted. Two small files is the cheap way to have both
# sessions agree.
#
# It is a whole `layout { focus-ring { ... } }` block rather than a bare list of
# colours because KDL has no variables -- niri config IS the only format it
# speaks. The rules that make that safe (layout is a singleton, includes merge
# property by property and are positional) are written out in the template.
#
# No post_hook, and here that is a feature rather than a limitation: niri
# watches its included files and reloads on its own, so writing the file is
# applying it. Hyprland needs wallpaper-switch to push the change with hyprctl.
[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'

# The Dunst template was here. Quickshell draws the notifications now and
# reads the palette live from colors.json, so there is no file to regenerate
# and no daemon to poke afterwards -- the post_hook called `dunstctl`, which
# went out with the package.

# ---- Non-KDE Qt6 apps (qBittorrent, OBS) ----
# The PALETTE only. The qt6ct config (which style, which icons) is a
# separate static file, ~/.config/qt6ct/qt6ct.conf, precisely so the qt6ct
# GUI can write it without matugen overwriting it on the next wallpaper
# change.
#
# No post_hook: qt6ct watches the file and open apps pick up the new palette
# by themselves.
[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6ct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

# ---- There is NO kdeglobals template: do not add one back ----
#
# There was one, for Dolphin. It was tested by putting an impossible red
# (255,0,0) in [Colors:Window] and counting pixels: 0% red in the window.
# KF6 (libKF6ColorScheme) listens on QStyleHints::colorSchemeChanged, sees
# the XDG portal asking for dark mode and applies its internal BreezeDark ON
# TOP of the platform theme. That defeated, in this order: the [Colors:*]
# sections of kdeglobals, a .colors file in ~/.local/share/color-schemes/,
# KDE_COLOR_SCHEME_PATH and [UiSettings] ColorScheme=. The only thing that
# handed control back was plasma-integration, which drags in
# xdg-desktop-portal-kde -- a second portal competing with Hyprland's, at
# the risk of screen capture and recording.
#
# The way out was changing the app, not the portal, and it ended up
# happening three times: Dolphin -> Nautilus, gwenview -> Loupe and
# Haruna -> Celluloid. All three replacements are GTK4/libadwaita and are
# themed by the GTK template below. No KF6 app is installed any more, so
# this section is history: it is here so nobody repeats the attempt.
#
# To find out whether an app will fall into this, check its libraries:
#   ldd $(which the-app) | grep KF6ColorScheme
# If it shows up, no amount of theming will help.
#
# Qt6 apps that are NOT KDE apps do get themed, via qt6ct.

# ---- Zathura ----
# The PDF reader. The WHOLE zathurarc is generated, not just the colours:
# zathura cannot include another file from its config, so it cannot be
# split. That is why zathura has no stow package of its own.
#
# No post_hook: zathura reads the config when it opens, it does not reload
# live.
[templates.zathura]
input_path = '~/.config/matugen/templates/zathurarc'
output_path = '~/.config/zathura/zathurarc'

# ---- Ranger ----
# The terminal file manager. It is curses: it does not understand hex, only
# indices into the 256-colour palette. That is why only the accent is
# written here, in decimal RGB, and the conversion to an index is done by
# the colorscheme itself, in Python, at startup (see
# ~/.config/ranger/colorschemes/tokyonight.py).
#
# Everything else -- background, text, directories, permissions -- stays on
# the 16 ANSI colours kitty gets from kitty-scheme.conf above, so ranger
# follows the scheme without matugen having to weigh in and without this
# repository holding a second copy of those sixteen values.
#
# No post_hook: ranger is not a daemon. It reads the file when it opens,
# same as fastfetch and cship.
[templates.ranger]
input_path = '~/.config/matugen/templates/ranger-accent'
output_path = '~/.config/ranger/accent'

# ---- GTK apps ----
# TWO templates, not one. The GTK3 and GTK4 colour names do not clash, so
# for a while it was a single file written to both places -- but the CSS
# RULES of the Adwaita GTK3 patch DID apply to GTK4, drawing boxes and
# borders around Nautilus's flat buttons. Each toolkit now has its own. The
# long explanation is in the header of each template.
#
# No post_hook on purpose: GTK does not reload user CSS live and there is no
# signal to send it. Apps pick up the new palette when they open, same as
# ranger, fastfetch and cship.
#
# WHY A SELECTOR IN EITHER OF THESE FILES IS DANGEROUS, and it is not about
# taste. Both are written to ~/.config, which GTK loads at priority USER
# (800), above the sheet an application passes for itself (APPLICATION, 600).
# A @define-color declares a variable and overrides nobody, so priority stops
# mattering; a RULE beats every app on the machine. That is how the old GTK3
# patch made wofi impossible to make transparent, and its workaround -- hiding
# ~/.config behind an empty XDG_CONFIG_HOME -- left Discord, Brave and OpenRGB
# reading an empty config on tmpfs after every reboot (2026-08-01).
#
# gtk3-colors.css therefore writes @define-color and nothing else, and the
# theme doing the painting is adw-gtk3-dark (package adw-gtk-theme), which
# reads those names.
#
# gtk4-colors.css is NOT rule-free, and this file used to claim it was. It
# carries a handful of rules that libadwaita gives no colour name for, and
# the rule that replaces "never a selector" is: every selector must be
# anchored to something only the app it was written for has. .content-pane
# alone is not that anchor -- libadwaita puts the class on the content side of
# EVERY split view, so an unanchored rule reaches Loupe as readily as
# Nautilus. See the header of the template for what each rule is anchored to.
[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4-colors.css'
output_path = '~/.config/gtk-4.0/gtk.css'

# ---- Zen Browser ----
# The only browser whose OWN interface -- tabs, sidebar, omnibox -- can be
# painted from a generated file. Chromium (Brave) cannot: at best it copies
# the GTK theme at startup, so it can never follow a wallpaper change.
#
# TWO templates, base and accent, the same split as kitty. zen-colors.css is one
# single line, --zen-primary-color, because Zen derives its entire palette from
# it with color-mix. zen-scheme.css carries the three surfaces, which were
# literals in userChrome.css until the scheme existed.
#
# THEY COULD NOT STAY THERE, and the reason is the cascade rather than taste. CSS
# only accepts @import before any rule, so an imported sheet always loses to a
# declaration in the file that imported it. Kept in userChrome.css as a
# fresh-clone fallback, the three hardcoded surfaces would have beaten the
# generated ones and the scheme would have appeared to do nothing -- exactly the
# trap opacity.css hit, and it is documented next to that import.
#
# What is versioned is userChrome.css itself, which is now the imports and the
# reasoning: it is the only file Firefox reads chrome from, so the imports have
# to live somewhere and that is the somewhere.
#
# The output goes INSIDE the profile, ~/.zen/rice: that is the only place
# Firefox reads chrome/ from. The profile has a fixed name for exactly this
# reason -- the random xxxxxxxx.Default that Zen creates on its own gives
# neither matugen nor stow a stable path. It is declared in
# ~/.zen/profiles.ini, and userChrome.css needs
# toolkit.legacyUserProfileCustomizations.stylesheets, pinned in the
# profile's user.js.
#
# No post_hook, and this one is a limitation rather than a choice: Firefox
# reads userChrome.css once at startup and ignores later writes, so the new
# accent shows up when Zen restarts, not with the wallpaper fade. There is
# nothing to signal. Live reload would mean fx-autoconfig, which installs
# into /opt/zen-browser-bin and would be wiped by every package update; the
# reasoning is in userChrome.css.
[templates.zen-scheme]
input_path = '~/.config/matugen/templates/zen-scheme.css'
output_path = '~/.zen/rice/chrome/scheme.css'

[templates.zen]
input_path = '~/.config/matugen/templates/zen-colors.css'
output_path = '~/.zen/rice/chrome/colors.css'

# ---- Fastfetch ----
# Same case as zathura and cship: fastfetch does not support "include", so the
# template IS the entire config. To touch modules, icons or the logo edit
# templates/fastfetch-config.jsonc, not ~/.config/fastfetch.
#
# Only the title (primary) and the keys (tertiary) are derived. The VALUES are
# the scheme's `ui_text`: they are the text you actually read and cannot depend
# on how light the wallpaper accent comes out. That role used to be spelled as
# kitty.conf's foreground, back when the foreground was a literal there; both
# now come out of the scheme, so the two still match without either file
# holding a copy of the other's hex.
#
# No post_hook: fastfetch is not a daemon, it re-reads the config on every
# run (same as ranger and cship).
[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch-config.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

# ---- cship ----
# The Claude Code status line. Third file in the same situation as zathura and
# fastfetch: the WHOLE config is generated because there is nothing to split it
# into. cship reads "a starship.toml config file" (its own --help), TOML has no
# include construct, and the binary carries no import of its own -- so the
# layout, the thresholds and the styles travel with the colours. To change a
# symbol or a threshold, edit the template.
#
# UNLIKE zathura and fastfetch, this one REPLACES A FILE THAT WAS VERSIONED.
# shell/.config/cship.toml is gone from the repository, and the stow link it left
# in ~/.config is a dangling one that points back inside the checkout -- which
# matugen would happily follow and write through. `install.sh apply symlinks`
# clears stale links (lib/units/40-symlinks.sh), and .gitignore carries the path
# as the net for the case where it has not been run yet.
#
# Nothing here is derived from the image: it is sem_info / sem_warning /
# sem_critical and one ui_text_variant. An alert is never harmonised with the
# wallpaper, which is the same rule the GTK templates and Theme.qml follow.
#
# No post_hook: cship is not a daemon. Claude Code runs it once per status line
# and it reads the config each time, same as fastfetch and ranger.
[templates.cship]
input_path = '~/.config/matugen/templates/cship.toml'
output_path = '~/.config/cship.toml'

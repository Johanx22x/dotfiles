# matugen - generates the accent palette from the current wallpaper
#
# Triggered by ~/.local/bin/wallpaper-switch. Only ACCENTS are derived:
# backgrounds and text colour stay fixed in every app to guarantee contrast
# no matter which wallpaper comes up.
#
# Template syntax: {{colors.<role>.default.hex}}
# Useful roles: primary, secondary, tertiary, source_color, error, outline

[config]

# ---- Harmonised semantic colours ----
# Some elements CANNOT use primary/tertiary without losing their meaning:
# the three segments of #custom-system have to be told apart at a glance,
# and the gamescope button has to read as "an action" rather than one more
# piece of data.
#
# With "blend = true" matugen takes the original Tokyo Night hue and rotates
# it towards the wallpaper colour (Material You's harmonize): it stays
# purple / green / blue, but from the image's family. That way the
# relationship between the three survives any wallpaper, which would not
# happen by assigning them scheme roles (with a green image, primary and the
# RAM green would come out nearly identical).
#
# warning (#e0af68) and critical (#f7768e) are NOT harmonised: they are
# alerts and must always look the same, even over a red wallpaper.
[config.custom_colors]
cpu = { color = "#bb9af7", blend = true }   # magenta TN
ram = { color = "#9ece6a", blend = true }   # TN green -- also the gs button
gpu = { color = "#7aa2f7", blend = true }   # blue TN

# ---- Waybar ----
# Defines only @accent, @accent2 and @accent3; style.css imports it and
# keeps its own fixed @base/@text.
[templates.waybar]
input_path = '/home/johan/.config/matugen/templates/waybar-colors.css'
output_path = '/home/johan/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar || true'

# ---- Waybar: system module ----
# #custom-system colours each segment with Pango markup from Python, not
# with CSS, so it needs the palette in a format it can read.
# No post_hook: the script runs every 3s (interval in config.jsonc) and
# picks up the new file on its own.
[templates.waybar_system]
input_path = '/home/johan/.config/matugen/templates/waybar-colors.json'
output_path = '/home/johan/.config/waybar/colors.json'

# ---- Kitty ----
# Background, text and the 16 ANSI colours still come from kitty.conf.
# Only cursor, selection, tabs and links here.
[templates.kitty]
input_path = '/home/johan/.config/matugen/templates/kitty-colors.conf'
output_path = '/home/johan/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR1 -x kitty || true'

# ---- Hyprland ----
# A Lua table that hyprland.lua reads at startup. The live change is done by
# wallpaper-switch through hyprctl, without reloading the whole config.
[templates.hyprland]
input_path = '/home/johan/.config/matugen/templates/hypr-colors.lua'
output_path = '/home/johan/.config/hypr/colors.lua'

# ---- Dunst ----
# dunst does not support "include", so the whole file is regenerated.
# To change any setting, edit the TEMPLATE, not the dunstrc.
[templates.dunst]
input_path = '/home/johan/.config/matugen/templates/dunstrc'
output_path = '/home/johan/.config/dunst/dunstrc'
post_hook = 'dunstctl reload || true'

# ---- Wofi ----
# Same scheme as waybar: accents only. No post_hook because wofi is not a
# daemon; it reads the CSS every time it is launched.
[templates.wofi]
input_path = '/home/johan/.config/matugen/templates/wofi-colors.css'
output_path = '/home/johan/.config/wofi/colors.css'

# ---- Non-KDE Qt6 apps (qBittorrent, OBS) ----
# The PALETTE only. The qt6ct config (which style, which icons) is a
# separate static file, ~/.config/qt6ct/qt6ct.conf, precisely so the qt6ct
# GUI can write it without matugen overwriting it on the next wallpaper
# change.
#
# No post_hook: qt6ct watches the file and open apps pick up the new palette
# by themselves.
[templates.qt6ct]
input_path = '/home/johan/.config/matugen/templates/qt6ct-colors.conf'
output_path = '/home/johan/.config/qt6ct/colors/matugen.conf'

# ---- There is NO kdeglobals template: do not add one back ----
#
# There was one, for Dolphin. It was tested by putting an impossible red
# (255,0,0) in [Colors:Window] and counting pixels: 0% red in the window.
# KF6 (libKF6ColorScheme) listens on QStyleHints::colorSchemeChanged, sees
# the XDG portal asking for dark mode and applies its internal BreezeDark ON
# TOP of the platform theme. That defeated, in this order: the [Colors:*]
# sections of kdeglobals, a .colors file in ~/.local/share/color-schemes/,
# KDE_COLOR_SCHEME_PATH and [UiSettings] ColorScheme=. The only thing that
# handed control back was plasma-integration, which drags in
# xdg-desktop-portal-kde -- a second portal competing with Hyprland's, at
# the risk of screen capture and recording.
#
# The way out was changing the app, not the portal, and it ended up
# happening three times: Dolphin -> Nautilus, gwenview -> Loupe and
# Haruna -> Celluloid. All three replacements are GTK4/libadwaita and are
# themed by the GTK template below. No KF6 app is installed any more, so
# this section is history: it is here so nobody repeats the attempt.
#
# To find out whether an app will fall into this, check its libraries:
#   ldd $(which the-app) | grep KF6ColorScheme
# If it shows up, no amount of theming will help.
#
# Qt6 apps that are NOT KDE apps do get themed, via qt6ct.

# ---- Zathura ----
# The PDF reader. The WHOLE zathurarc is generated, not just the colours:
# zathura cannot include another file from its config, so it cannot be
# split. That is why zathura has no stow package of its own.
#
# No post_hook: zathura reads the config when it opens, it does not reload
# live.
[templates.zathura]
input_path = '/home/johan/.config/matugen/templates/zathurarc'
output_path = '/home/johan/.config/zathura/zathurarc'

# ---- Ranger ----
# The terminal file manager. It is curses: it does not understand hex, only
# indices into the 256-colour palette. That is why only the accent is
# written here, in decimal RGB, and the conversion to an index is done by
# the colorscheme itself, in Python, at startup (see
# ~/.config/ranger/colorschemes/tokyonight.py).
#
# Everything else -- background, text, directories, permissions -- stays on
# the 16 ANSI colours kitty.conf already defines, so ranger inherits Tokyo
# Night without matugen having to weigh in.
#
# No post_hook: ranger is not a daemon. It reads the file when it opens,
# same as wofi and fastfetch.
[templates.ranger]
input_path = '/home/johan/.config/matugen/templates/ranger-accent'
output_path = '/home/johan/.config/ranger/accent'

# ---- GTK apps ----
# TWO templates, not one. The GTK3 and GTK4 colour names do not clash, so
# for a while it was a single file written to both places -- but the CSS
# RULES of the Adwaita GTK3 patch DID apply to GTK4, drawing boxes and
# borders around Nautilus's flat buttons. Each toolkit now has its own. The
# long explanation is in the header of each template.
#
# No post_hook on purpose: GTK does not reload user CSS live and there is no
# signal to send it. Apps pick up the new palette when they open, same as
# wofi, ranger and fastfetch.
[templates.gtk3]
input_path = '/home/johan/.config/matugen/templates/gtk3-colors.css'
output_path = '/home/johan/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '/home/johan/.config/matugen/templates/gtk4-colors.css'
output_path = '/home/johan/.config/gtk-4.0/gtk.css'

# ---- Fastfetch ----
# Same case as dunst: fastfetch does not support "include", so the template
# IS the entire config. To touch modules, icons or the logo edit
# templates/fastfetch-config.jsonc, not ~/.config/fastfetch.
#
# Only the title (primary) and the keys (tertiary) are derived. The VALUES
# stay on kitty.conf's foreground: they are the text you actually read and
# cannot depend on how light the wallpaper accent comes out.
#
# No post_hook: fastfetch is not a daemon, it re-reads the config on every
# run (same as wofi).
[templates.fastfetch]
input_path = '/home/johan/.config/matugen/templates/fastfetch-config.jsonc'
output_path = '/home/johan/.config/fastfetch/config.jsonc'

# GENERATED BY MATUGEN - do not edit by hand.
# Template: ~/.config/matugen/templates/qt6ct-colors.conf
# Wallpaper: {{image}}
#
# Palette for the Qt6 apps that are NOT KDE apps (qBittorrent, OBS). KDE apps
# do not go through here for their own colours: they use KColorScheme, which
# cannot be overridden from the platform theme. None are installed any more.
#
# ---- FORMAT (verified against /usr/share/qt6ct/colors/darker.conf) ----
# 21 colours per line, in a FIXED ORDER: that of Qt's QPalette::ColorRole
# enum. There are no names, only position, so slipping in or dropping a comma
# shifts the whole palette and the result is unreadable without raising any
# error. The index is in the comment of each block below.
#
# Each colour is #AARRGGBB: the ALPHA COMES FIRST, the opposite of CSS. That
# is why they all carry the "ff" prefix (opaque) and only PlaceholderText
# uses "80" (50%).
#
# The three lists are the three QPalette::ColorGroup values:
#   active   = the focused window
#   disabled = disabled widgets
#   inactive = the window exists but does not have focus
#
# Same rule as everywhere else (see config.toml): fixed Tokyo Night
# backgrounds and text, and from matugen only Highlight, HighlightedText and
# the two link colours.

[ColorScheme]

# 0  WindowText      #c0caf5  text over the window background
# 1  Button          #292e42  button background
# 2  Light           #414868  lit edge of the bevel
# 3  Midlight        #363b54
# 4  Dark            #15161e
# 5  Mid             #1f2335
# 6  Text            #c0caf5  text inside Base (lists, fields)
# 7  BrightText      #f7768e  "watch out" text; semantic, fixed
# 8  ButtonText      #c0caf5
# 9  Base            #15161e  background of text fields and lists
# 10 Window          #1a1b26  general background, = @base in waybar
# 11 Shadow          #0d0e14
# 12 Highlight       ACCENT   <- selection; comes from the wallpaper
# 13 HighlightedText ACCENT   <- on_primary: contrast guaranteed
# 14 Link            ACCENT
# 15 LinkVisited     ACCENT
# 16 AlternateBase   #1a1b26  alternating table rows
# 17 NoRole          #1a1b26
# 18 ToolTipBase     #292e42
# 19 ToolTipText     #c0caf5
# 20 PlaceholderText #80c0caf5 (the hint text of an empty field, at 50%)
active_colors=#ffc0caf5, #ff292e42, #ff414868, #ff363b54, #ff15161e, #ff1f2335, #ffc0caf5, #fff7768e, #ffc0caf5, #ff15161e, #ff1a1b26, #ff0d0e14, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.on_primary.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff1a1b26, #ff1a1b26, #ff292e42, #ffc0caf5, #80c0caf5

# Disabled: the TEXT (indices 0, 6, 8, 13, 20) is dimmed to #565f89, the same
# @subtext as waybar. The BACKGROUNDS are left alone: lightening the
# background of a disabled widget on a dark theme is exactly what makes it
# unreadable. Highlight (12) is dimmed to #292e42 too, so a selection in a
# disabled list does not shout.
disabled_colors=#ff565f89, #ff292e42, #ff414868, #ff363b54, #ff15161e, #ff1f2335, #ff565f89, #ff565f89, #ff565f89, #ff15161e, #ff1a1b26, #ff0d0e14, #ff292e42, #ff565f89, #ff414868, #ff414868, #ff1a1b26, #ff1a1b26, #ff292e42, #ff565f89, #80565f89

# Unfocused: the text stays readable (this is not an error state, the window
# is merely behind), but the selection drops to primary_container instead of
# the full accent. That way a glance tells you which of the two windows has
# focus.
inactive_colors=#ffc0caf5, #ff292e42, #ff414868, #ff363b54, #ff15161e, #ff1f2335, #ffc0caf5, #fff7768e, #ffc0caf5, #ff15161e, #ff1a1b26, #ff0d0e14, #ff{{colors.primary_container.default.hex_stripped}}, #ff{{colors.on_primary_container.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff1a1b26, #ff1a1b26, #ff292e42, #ffc0caf5, #80c0caf5

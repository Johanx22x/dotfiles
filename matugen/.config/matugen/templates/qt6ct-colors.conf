# GENERATED BY MATUGEN - do not edit by hand.
# Template: ~/.config/matugen/templates/qt6ct-colors.conf
# Wallpaper: {{image}}
#
# Palette for the Qt6 apps that are NOT KDE apps (qBittorrent, OBS). KDE apps
# do not go through here for their own colours: they use KColorScheme, which
# cannot be overridden from the platform theme. None are installed any more.
#
# ---- FORMAT (verified against /usr/share/qt6ct/colors/darker.conf) ----
# 21 colours per line, in a FIXED ORDER: that of Qt's QPalette::ColorRole
# enum. There are no names, only position, so slipping in or dropping a comma
# shifts the whole palette and the result is unreadable without raising any
# error. The index is in the comment of each block below.
#
# Each colour is #AARRGGBB: the ALPHA COMES FIRST, the opposite of CSS. That
# is why they all carry the "ff" prefix (opaque) and only PlaceholderText
# uses "80" (50%).
#
# The three lists are the three QPalette::ColorGroup values:
#   active   = the focused window
#   disabled = disabled widgets
#   inactive = the window exists but does not have focus
#
# Same rule as everywhere else (see config.toml): the backgrounds, the text and
# the bevel come from the scheme's `ui_*` roles and BrightText from `sem_*`,
# while Highlight, HighlightedText and the two link colours are the wallpaper's.
# All of the first group were fixed Tokyo Night hex literals here until
# `desktop-scheme` existed.

[ColorScheme]

# The role each index reads. It was the hex each index held, back when they were
# literals; the names are what survives a scheme change, and the values are in
# schemes/README.md 1.1 for all three schemes at once.
#
# 0  WindowText      ui_text          text over the window background
# 1  Button          ui_bg_button     button background
# 2  Light           ui_border        lit edge of the bevel
# 3  Midlight        ui_bevel_midlight
# 4  Dark            ui_bevel_dark
# 5  Mid             ui_bevel_mid
# 6  Text            ui_text          text inside Base (lists, fields)
# 7  BrightText      sem_critical     "watch out" text; the scheme's, not the image's
# 8  ButtonText      ui_text
# 9  Base            ui_bg_field      background of text fields and lists
# 10 Window          ui_bg            general background
# 11 Shadow          ui_bg_shadow
# 12 Highlight       ACCENT   <- selection; comes from the wallpaper
# 13 HighlightedText ACCENT   <- on_primary: contrast guaranteed
# 14 Link            ACCENT   <- tertiary
# 15 LinkVisited     ACCENT   <- secondary
# 16 AlternateBase   ui_bg_alt_row    alternating table rows
# 17 NoRole          ui_bg
# 18 ToolTipBase     ui_bg_raised
# 19 ToolTipText     ui_text
# 20 PlaceholderText ui_text at "80" (the hint text of an empty field, at 50%)
active_colors=#ff{{colors.ui_text.default.hex_stripped}}, #ff{{colors.ui_bg_button.default.hex_stripped}}, #ff{{colors.ui_border.default.hex_stripped}}, #ff{{colors.ui_bevel_midlight.default.hex_stripped}}, #ff{{colors.ui_bevel_dark.default.hex_stripped}}, #ff{{colors.ui_bevel_mid.default.hex_stripped}}, #ff{{colors.ui_text.default.hex_stripped}}, #ff{{colors.sem_critical.default.hex_stripped}}, #ff{{colors.ui_text.default.hex_stripped}}, #ff{{colors.ui_bg_field.default.hex_stripped}}, #ff{{colors.ui_bg.default.hex_stripped}}, #ff{{colors.ui_bg_shadow.default.hex_stripped}}, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.on_primary.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff{{colors.ui_bg_alt_row.default.hex_stripped}}, #ff{{colors.ui_bg.default.hex_stripped}}, #ff{{colors.ui_bg_raised.default.hex_stripped}}, #ff{{colors.ui_text.default.hex_stripped}}, #80{{colors.ui_text.default.hex_stripped}}

# Disabled: the TEXT (indices 0, 6, 8, 13, 20) is dimmed to ui_text_muted, the
# role every application here dims text with. The BACKGROUNDS are left alone:
# lightening the background of a disabled widget on a dark theme is exactly what
# makes it unreadable. Highlight (12) drops to ui_selection_disabled too, so a
# selection in a disabled list does not shout.
disabled_colors=#ff{{colors.ui_text_muted.default.hex_stripped}}, #ff{{colors.ui_bg_button.default.hex_stripped}}, #ff{{colors.ui_border.default.hex_stripped}}, #ff{{colors.ui_bevel_midlight.default.hex_stripped}}, #ff{{colors.ui_bevel_dark.default.hex_stripped}}, #ff{{colors.ui_bevel_mid.default.hex_stripped}}, #ff{{colors.ui_text_muted.default.hex_stripped}}, #ff{{colors.ui_text_muted.default.hex_stripped}}, #ff{{colors.ui_text_muted.default.hex_stripped}}, #ff{{colors.ui_bg_field.default.hex_stripped}}, #ff{{colors.ui_bg.default.hex_stripped}}, #ff{{colors.ui_bg_shadow.default.hex_stripped}}, #ff{{colors.ui_selection_disabled.default.hex_stripped}}, #ff{{colors.ui_text_muted.default.hex_stripped}}, #ff{{colors.ui_border.default.hex_stripped}}, #ff{{colors.ui_border.default.hex_stripped}}, #ff{{colors.ui_bg_alt_row.default.hex_stripped}}, #ff{{colors.ui_bg.default.hex_stripped}}, #ff{{colors.ui_bg_raised.default.hex_stripped}}, #ff{{colors.ui_text_muted.default.hex_stripped}}, #80{{colors.ui_text_muted.default.hex_stripped}}

# Unfocused: the text stays readable (this is not an error state, the window
# is merely behind), but the selection drops to primary_container instead of
# the full accent. That way a glance tells you which of the two windows has
# focus.
inactive_colors=#ff{{colors.ui_text.default.hex_stripped}}, #ff{{colors.ui_bg_button.default.hex_stripped}}, #ff{{colors.ui_border.default.hex_stripped}}, #ff{{colors.ui_bevel_midlight.default.hex_stripped}}, #ff{{colors.ui_bevel_dark.default.hex_stripped}}, #ff{{colors.ui_bevel_mid.default.hex_stripped}}, #ff{{colors.ui_text.default.hex_stripped}}, #ff{{colors.sem_critical.default.hex_stripped}}, #ff{{colors.ui_text.default.hex_stripped}}, #ff{{colors.ui_bg_field.default.hex_stripped}}, #ff{{colors.ui_bg.default.hex_stripped}}, #ff{{colors.ui_bg_shadow.default.hex_stripped}}, #ff{{colors.primary_container.default.hex_stripped}}, #ff{{colors.on_primary_container.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff{{colors.ui_bg_alt_row.default.hex_stripped}}, #ff{{colors.ui_bg.default.hex_stripped}}, #ff{{colors.ui_bg_raised.default.hex_stripped}}, #ff{{colors.ui_text.default.hex_stripped}}, #80{{colors.ui_text.default.hex_stripped}}

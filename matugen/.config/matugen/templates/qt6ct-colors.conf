# GENERADO POR MATUGEN - no editar a mano.
# Plantilla: ~/.config/matugen/templates/qt6ct-colors.conf
# Wallpaper: {{image}}
#
# Paleta para las apps Qt6 que NO son de KDE (qBittorrent). Dolphin no
# pasa por aqui para sus colores propios: usa KColorScheme y lee
# ~/.config/kdeglobals. Hacen falta las dos piezas.
#
# ---- FORMATO (verificado contra /usr/share/qt6ct/colors/darker.conf) ----
# Son 21 colores por linea, en ORDEN FIJO: el del enum
# QPalette::ColorRole de Qt. No hay nombres, solo posicion, asi que
# colar o quitar una coma desplaza toda la paleta y el resultado es
# ilegible pero no da ningun error. El indice va en el comentario de
# cada bloque de abajo.
#
# Cada color es #AARRGGBB: el ALFA VA PRIMERO, al reves que en CSS.
# Por eso todos llevan el prefijo "ff" (opaco) y solo PlaceholderText
# usa "80" (50%).
#
# Las tres listas son los tres QPalette::ColorGroup:
#   active   = la ventana enfocada
#   disabled = widgets desactivados
#   inactive = la ventana existe pero no tiene el foco
#
# Misma regla que el resto (ver config.toml): fondos y texto fijos de
# Tokyo Night, y de matugen solo Highlight, HighlightedText y los dos
# de enlaces.

[ColorScheme]

# 0  WindowText      #c0caf5  texto sobre el fondo de ventana
# 1  Button          #292e42  fondo de boton
# 2  Light           #414868  borde iluminado del relieve
# 3  Midlight        #363b54
# 4  Dark            #15161e
# 5  Mid             #1f2335
# 6  Text            #c0caf5  texto dentro de Base (listas, campos)
# 7  BrightText      #f7768e  texto de "ojo con esto"; semantico, fijo
# 8  ButtonText      #c0caf5
# 9  Base            #15161e  fondo de campos de texto y listas
# 10 Window          #1a1b26  fondo general, = @base de waybar
# 11 Shadow          #0d0e14
# 12 Highlight       ACENTO   <- seleccion; sale del wallpaper
# 13 HighlightedText ACENTO   <- on_primary: contraste garantizado
# 14 Link            ACENTO
# 15 LinkVisited     ACENTO
# 16 AlternateBase   #1a1b26  filas alternas de las tablas
# 17 NoRole          #1a1b26
# 18 ToolTipBase     #292e42
# 19 ToolTipText     #c0caf5
# 20 PlaceholderText #80c0caf5 (el texto guia de un campo vacio, al 50%)
active_colors=#ffc0caf5, #ff292e42, #ff414868, #ff363b54, #ff15161e, #ff1f2335, #ffc0caf5, #fff7768e, #ffc0caf5, #ff15161e, #ff1a1b26, #ff0d0e14, #ff{{colors.primary.default.hex_stripped}}, #ff{{colors.on_primary.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff1a1b26, #ff1a1b26, #ff292e42, #ffc0caf5, #80c0caf5

# Desactivado: se apaga el TEXTO (indices 0, 6, 8, 13, 20) a #565f89,
# que es el mismo @subtext de waybar. Los FONDOS no se tocan: aclarar
# el fondo de un widget desactivado sobre un tema oscuro es justo lo
# que lo vuelve ilegible. Highlight (12) tambien se apaga a #292e42
# para que una seleccion en una lista desactivada no grite.
disabled_colors=#ff565f89, #ff292e42, #ff414868, #ff363b54, #ff15161e, #ff1f2335, #ff565f89, #ff565f89, #ff565f89, #ff15161e, #ff1a1b26, #ff0d0e14, #ff292e42, #ff565f89, #ff414868, #ff414868, #ff1a1b26, #ff1a1b26, #ff292e42, #ff565f89, #80565f89

# Sin foco: el texto se mantiene legible (no es un estado de error, la
# ventana solo esta detras), pero la seleccion baja a primary_container
# en vez del acento pleno. Asi de un vistazo se ve cual de las dos
# ventanas tiene el foco. Mismo criterio que
# ForegroundInactive/theme_unfocused_selected en kdeglobals.
inactive_colors=#ffc0caf5, #ff292e42, #ff414868, #ff363b54, #ff15161e, #ff1f2335, #ffc0caf5, #fff7768e, #ffc0caf5, #ff15161e, #ff1a1b26, #ff0d0e14, #ff{{colors.primary_container.default.hex_stripped}}, #ff{{colors.on_primary_container.default.hex_stripped}}, #ff{{colors.tertiary.default.hex_stripped}}, #ff{{colors.secondary.default.hex_stripped}}, #ff1a1b26, #ff1a1b26, #ff292e42, #ffc0caf5, #80c0caf5

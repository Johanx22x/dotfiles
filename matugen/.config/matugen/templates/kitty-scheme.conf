# GENERATED BY MATUGEN - do not edit by hand.
# Template: ~/.config/matugen/templates/kitty-scheme.conf
# Wallpaper: {{image}}
#
# THE BASE PALETTE, and it is the half that decides whether this terminal reads
# as Tokyo Night or as Gruvbox: the sixteen ANSI slots, the foreground, the
# background. They used to be 31 hex literals in kitty.conf, where nothing could
# reach them -- changing the scheme changed the shell and left the terminal
# where it was.
#
# Every value here comes from the scheme file `desktop-scheme` hands matugen,
# not from the image. The wallpaper line above is provenance for the render, not
# for the colours: this file only changes when the SCHEME changes, and re-renders
# identically on every wallpaper change in between.
#
# INCLUDED BEFORE colors.conf, AND THAT ORDER IS THE MECHANISM. kitty applies
# includes where it meets them and the last setting of a name wins, so the
# accent file has to come after this one. Everything below that colors.conf also
# sets -- cursor, selection, url, the active tab, the active border -- is
# therefore a fallback that only shows on a machine where matugen has run for
# this file and not for that one, which is not a state that exists. What
# colors.conf does NOT set is what actually paints: the 16 slots and fg/bg.
#
# THE SELECTION PAIR IS THE SCHEME'S OWN TWO ROLES, and it took a measurement to
# notice it was not. `selection_foreground` read `ui_on_accent` -- the ink that
# goes over an ACCENT fill -- while the ground under it is `term_selection_bg`,
# a dark blue that is not an accent at all. Under Tokyo Night that paired
# #1a1b26 on #283457: 1.40:1, selected text all but invisible. With
# `term_selection_fg`, the role written for this exact ground and until now read
# by nothing anywhere, the same pair is #c0caf5 on #283457, 7.57:1. The rule the
# templates keep everywhere else is both halves of it: a role deserves a reader
# in the same change, and a colour is only ever placed on the ground its own
# role names.
#
# THE ANSI SLOTS REACH FURTHER THAN THIS TERMINAL. ranger's colorscheme paints
# with indices and no hex at all, zsh hands fzf `--color=16`, and every TUI in
# the session draws out of the same sixteen. They follow the scheme because
# these lines do.
#
# post_hook: the same `pkill -SIGUSR1 -x kitty` colors.conf carries, and the
# duplication is deliberate. matugen does NOT render templates in the order
# config.toml declares them -- measured on 4.2.0 with three templates and a
# logging hook, the order changed between runs of the same command, and each
# post_hook fires right after its own template rather than after all of them.
# With the hook on only one of the two, the run that reloads kitty first leaves
# the terminal showing half the new theme until something else signals it.

foreground              {{colors.term_fg.default.hex}}
background              {{colors.term_bg.default.hex}}
selection_foreground    {{colors.term_selection_fg.default.hex}}
selection_background    {{colors.term_selection_bg.default.hex}}

cursor                  {{colors.term_cursor.default.hex}}
cursor_text_color       {{colors.term_cursor_text.default.hex}}


active_tab_foreground   {{colors.ui_on_accent.default.hex}}
active_tab_background   {{colors.fb_primary.default.hex}}
inactive_tab_foreground {{colors.term_tab_inactive_fg.default.hex}}
inactive_tab_background {{colors.term_tab_bg.default.hex}}

# GENERATED BY MATUGEN - do not edit by hand.
# Template: ~/.config/matugen/templates/kitty-colors.conf
# Wallpaper: {{image}}
#
# Accents only, and the other half is kitty-scheme.conf next door: the
# background, the text and the 16 ANSI colours are the scheme's, and they were
# literals in kitty.conf until that template existed. kitty.conf includes
# scheme.conf first and this file after it, so what is below paints over the
# base rather than the other way round -- the reasoning is in that template's
# header.
#
# Not everything here is the wallpaper's, either: the two roles that need a
# ground to sit on -- the ink over an accent fill, the inactive tab -- come from
# the scheme, because that is where their ground is.

cursor                  {{colors.primary.default.hex}}
cursor_text_color       background

selection_foreground    {{colors.ui_on_accent.default.hex}}
selection_background    {{colors.primary.default.hex}}

url_color               {{colors.tertiary.default.hex}}

active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.term_border_inactive.default.hex}}

active_tab_background   {{colors.primary.default.hex}}
active_tab_foreground   {{colors.ui_on_accent.default.hex}}
inactive_tab_background {{colors.term_tab_bg.default.hex}}
inactive_tab_foreground {{colors.term_tab_inactive_fg.default.hex}}

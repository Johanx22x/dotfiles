# GENERATED BY MATUGEN - do not edit by hand.
# Template: ~/.config/matugen/templates/cship.toml
# Wallpaper: {{image}}
#
# THE WHOLE FILE and not just the colours, the same arrangement zathurarc and
# fastfetch-config.jsonc are in and for the same reason: there is nothing to
# split it into. cship reads "a starship.toml config file" (its own --help), TOML
# has no include construct, and the binary carries no import or include of its
# own -- so the layout, the thresholds and the styles have to travel together.
# To change a symbol, a width or a threshold, edit THIS file, not
# ~/.config/cship.toml, which is overwritten on every wallpaper change.
#
# Nothing here comes from the image: every colour is a `sem_*` or `ui_*` role out
# of the scheme file. The wallpaper line above is provenance for the render.
#
# No post_hook: cship is not a daemon. Claude Code runs it once per status line
# and it reads the config each time.
#
# "Hero / Recommended" preset from https://cship.dev/showcase.html: the two-row
# layout is theirs, the palette is not. The header used to say "Catppuccin Mocha
# palette copied as is"; it never was -- all four hexes in it were Tokyo Night,
# and they are roles now, so the desktop's scheme is what they follow.
#
# Row 1 is $starship_prompt, rendered with the catppuccin-powerline preset from
# ~/.config/starship-cship.toml (via STARSHIP_CONFIG in the statusLine of
# ~/.claude/settings.json), NOT with ~/.config/starship.toml. That row really is
# Catppuccin and stays that way; the shell prompt stays on matugen.

[cship]
lines = [
  "$starship_prompt",
  "$cship.model $cship.effort $cship.cost $cship.context_bar $cship.usage_limits $cship.peak_usage",
]

[cship.model]
symbol = " "
# A NAMED ANSI colour, not a hex, so it already follows the scheme: it resolves
# to whatever kitty's color6 is (term_cyan), the same sixteen slots every TUI in
# the session draws out of.
style  = "bold cyan"

[cship.effort]
symbol      = "⚡ "
style       = "fg:{{colors.sem_info.default.hex}}"
high_style  = "fg:{{colors.sem_warning.default.hex}}"
xhigh_style = "bold fg:{{colors.sem_warning.default.hex}}"
max_style   = "bold fg:{{colors.sem_critical.default.hex}}"

[cship.context_bar]
symbol             = " "
filled_char        = "●"
empty_char         = "○"
format             = "[$symbol$value]($style)"
width              = 10
style              = "fg:{{colors.sem_info.default.hex}}"
warn_threshold     = 40.0
warn_style         = "fg:{{colors.sem_warning.default.hex}}"
critical_threshold = 70.0
critical_style     = "bold fg:{{colors.sem_critical.default.hex}}"

[cship.cost]
symbol             = "💰 "
style              = "fg:{{colors.ui_text_variant.default.hex}}"
warn_threshold     = 10
warn_style         = "fg:{{colors.sem_warning.default.hex}}"
critical_threshold = 50
critical_style     = "bold fg:{{colors.sem_critical.default.hex}}"

[cship.usage_limits]
five_hour_format   = " 5h {pct}% ({reset})"
seven_day_format   = " 7d {pct}% ({reset})"
separator          = " "
warn_threshold     = 50.0
warn_style         = "fg:{{colors.sem_warning.default.hex}}"
critical_threshold = 80.0
critical_style     = "bold fg:{{colors.sem_critical.default.hex}}"

[cship.peak_usage]
symbol = "⏰ "
style  = "fg:{{colors.sem_warning.default.hex}}"

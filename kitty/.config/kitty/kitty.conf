# ~/.config/kitty/kitty.conf
# Live reload: ctrl+shift+f5   |   Show active config: ctrl+shift+f6

#: Font ────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

# Ligatures: 'always' enables them, 'never' disables them entirely.
# 'cursor' disables them only under the cursor (handy while editing).
disable_ligatures cursor

# Fine tuning of line spacing / cell width if the font looks cramped.
# Values in px or percent. E.g. 0 1 (1px extra at the bottom)
modify_font cell_height 100%

#: Cursor ────────────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0

#: Mouse ────────────────────────────────────────────────────────────
# THE POINTER, not the block above: that one is the text cursor. kitty hides
# the mouse pointer after three seconds of it not moving -- its own default,
# mouse_hide_wait 3.0 -- and it does it over its own window only, which is
# what makes it read as a compositor or cursor-theme fault when the terminal
# is what you happen to be looking at. Zero turns the hiding off entirely.
#
# A negative value would hide it the moment you type and bring it back on
# movement, which is what most terminals do. Not that either: a pointer that
# comes and goes is one more thing moving on screen.
mouse_hide_wait 0

#: Scrollback ────────────────────────────────────────────────────────
scrollback_lines 10000

#: Bell ───────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0

#: Window ───────────────────────────────────────────────────────────
# The gutter is painted by KITTY, not by the running program: a full-screen
# TUI such as neovim stops at the padding and its statusline or tabline ends
# up framed by a strip of terminal background. That only matters inside such
# a TUI, so instead of dropping the padding globally, neovim zeroes it for
# its own window on entry and restores it on exit (see the remote control
# section below).
window_padding_width  8
confirm_os_window_close 0

# Hyprland already draws the borders/decoration: no native title bar.
hide_window_decorations yes

#: Remote control ───────────────────────────────────────────────────
# Needed so neovim can drop this window's padding to 0 while it runs.
#
# 'password' rather than 'yes': every request, over the socket or the TTY,
# is checked against remote_control_password. The empty password below is
# the passwordless allowlist, and it lists only set-spacing, so a program
# running in the terminal can change paddings and margins and nothing else
# (no reading window contents, no sending keystrokes, no spawning windows).
allow_remote_control password
remote_control_password "" set-spacing

# The socket is what makes this usable from inside a full-screen TUI: over
# the TTY, kitty's reply would be swallowed by neovim's raw-mode input.
# kitty exports the resulting path as KITTY_LISTEN_ON, which is what
# 'kitty @' picks up.
listen_on unix:@kitty-{kitty_pid}

#: Transparency ─────────────────────────────────────────────────────
# 1.0 = opaque, 0.0 = invisible. Only affects the background: text stays
# fully opaque, so readability does not degrade.
background_opacity 0.70

# The blur of what is behind is applied by Hyprland (decoration:blur in
# hyprland.lua, already enabled), not kitty. kitty's background_blur option
# is macOS only and does nothing here.

# Allows changing the opacity live. Without this, background_opacity is
# frozen at startup. Shortcuts it enables (kitty ships them):
#   ctrl+shift+a > m   raise opacity
#   ctrl+shift+a > l   lower opacity
#   ctrl+shift+a > 1   fully opaque
#   ctrl+shift+a > d   back to the value in this file
dynamic_background_opacity yes

#: Tabs ──────────────────────────────────────────────────────────
tab_bar_edge   bottom
tab_bar_style  powerline
tab_powerline_style slanted

#: Useful shortcuts ─────────────────────────────────────────────────────
map ctrl+shift+enter launch --cwd=current
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

#: Theme ─────────────────────────────────────────────────────────────
# THE BASE PALETTE: the sixteen ANSI slots, the foreground, the background and
# the fallbacks for cursor, selection, URL, tabs and borders. Generated from the
# colour scheme (`desktop-scheme`), from matugen/templates/kitty-scheme.conf.
#
# These were 31 hex literals here until they became a scheme. They are the half
# of the palette that says Tokyo Night rather than Catppuccin, and while they
# lived in this file nothing could change them -- switching schemes repainted
# the shell and left the terminal exactly where it was.
#
# NOT IN THE REPO, and included FIRST of the four on purpose. kitty applies an
# include where it meets it and the last setting of a name wins, so this has to
# come before colors.conf: the base is the layer the wallpaper accents are
# painted over. See the note in the template for what colors.conf does and does
# not override.
#
# Missing until the first `wallpaper-switch random`, exactly like the three
# below, and then kitty comes up on its own defaults rather than on this
# desktop's. That is the same trade zathura, fastfetch and the GTK apps already
# make, and the installer's `palette` step is what closes it. The alternative --
# keeping the 31 literals here as a fresh-clone fallback, the way
# background_opacity and font_size below are kept -- is not the same case: an
# accent does not exist until a wallpaper is picked, so its fallback duplicates
# nothing, while a scheme is a versioned file in this repository and a copy of
# it here would be a second place to keep in step.
include scheme.conf

# Accents generated by matugen from the wallpaper.
# Goes after scheme.conf on purpose: it overrides the cursor, the selection, the
# URL, the tab bar and the active border with the colours of the image.
include colors.conf

# Background opacity written by the settings window (SUPER + C), through the
# `desktop-opacity` script. Same arrangement as colors.conf above: a generated
# file that is NOT in the repo, included last so it overrides the
# background_opacity set further up -- which stays as the value a fresh clone
# starts at, before anything has been generated.
#
# kitty re-reads its whole config on SIGUSR1, which is how the change lands in
# windows that are already open. New ones read it at startup.
include opacity.conf

# Type, written by the settings window (SUPER + C) through the `desktop-font`
# script. Same arrangement as colors.conf and opacity.conf: generated, not in
# the repo, included last so it overrides the font_family and font_size set at
# the top -- which stay as the values a fresh clone starts at.
#
# The shell and this terminal are ONE decision about type size, which is what
# the note in Theme.qml has said all along. This is that note made mechanical.
include font.conf

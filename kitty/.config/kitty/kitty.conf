# ~/.config/kitty/kitty.conf
# Recarga en caliente: ctrl+shift+f5   |   Ver config activa: ctrl+shift+f6

#: Fuente ────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

# Ligaduras: 'always' las activa, 'never' las desactiva por completo.
# 'cursor' las desactiva solo bajo el cursor (útil al editar).
disable_ligatures cursor

# Ajuste fino del interlineado / ancho de celda si la fuente se ve apretada.
# Valores en px o porcentaje. Ej: 0 1 (1px extra abajo)
modify_font cell_height 100%

#: Cursor ────────────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0

#: Scrollback ────────────────────────────────────────────────────────
scrollback_lines 10000

#: Campana ───────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0

#: Ventana ───────────────────────────────────────────────────────────
window_padding_width  8
confirm_os_window_close 0

# Hyprland ya dibuja los bordes/decoración: sin barra de título nativa.
hide_window_decorations yes

#: Transparencia ─────────────────────────────────────────────────────
# 1.0 = opaco, 0.0 = invisible. Solo afecta al fondo: el texto sigue
# a opacidad completa, así que la legibilidad no se degrada.
background_opacity 0.70

# El desenfoque de lo que hay detrás lo aplica Hyprland (decoration:blur
# en hyprland.lua, ya activo), no kitty. La opción background_blur de
# kitty es exclusiva de macOS y aquí no hace nada.

# Permite cambiar la opacidad en caliente. Sin esto, background_opacity
# queda congelada al arrancar. Atajos que habilita (los trae kitty):
#   ctrl+shift+a > m   subir opacidad
#   ctrl+shift+a > l   bajar opacidad
#   ctrl+shift+a > 1   opaco del todo
#   ctrl+shift+a > d   volver al valor de este archivo
dynamic_background_opacity yes

#: Pestañas ──────────────────────────────────────────────────────────
tab_bar_edge   bottom
tab_bar_style  powerline
tab_powerline_style slanted

#: Atajos útiles ─────────────────────────────────────────────────────
map ctrl+shift+enter launch --cwd=current
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

#: Tema — Tokyo Night ───────────────────────────────────────────────
# Los valores de cursor, seleccion, pestana activa, URLs y bordes que
# aparecen aqui son solo respaldo: colors.conf (matugen) los sobrescribe
# al final del archivo con los acentos del wallpaper.
foreground            #c0caf5
background            #1a1b26
selection_foreground  #1a1b26
selection_background  #33467c

cursor                #c0caf5
cursor_text_color     #1a1b26

url_color             #73daca

active_border_color   #7aa2f7
inactive_border_color #3b4261
bell_border_color     #e0af68

active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #16161e
tab_bar_background      #16161e

# black
color0  #15161e
color8  #414868
# red
color1  #f7768e
color9  #f7768e
# green
color2  #9ece6a
color10 #9ece6a
# yellow
color3  #e0af68
color11 #e0af68
# blue
color4  #7aa2f7
color12 #7aa2f7
# magenta
color5  #bb9af7
color13 #bb9af7
# cyan
color6  #7dcfff
color14 #7dcfff
# white
color7  #a9b1d6
color15 #c0caf5

# Acentos generados por matugen desde el wallpaper.
# Va al final a proposito: sobrescribe los valores de arriba.
include colors.conf

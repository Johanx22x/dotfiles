[Settings]
# NO gtk-application-prefer-dark-theme HERE, and that is a removal rather than
# an oversight. This file set it to 1 under a comment claiming GTK4 "does
# honour prefer-dark"; GTK 4.20 deprecated the property ("Use GtkCssProvider
# properties instead", and this machine runs 4.22), and libadwaita refuses it
# outright -- every launch logged "Using
# GtkSettings:gtk-application-prefer-dark-theme with libadwaita is unsupported.
# Please use AdwStyleManager:color-scheme instead." Five of those in one boot,
# from xdg-desktop-portal-gnome, Nautilus and loupe.
#
# The dark was never coming from here anyway. It comes from the settings
# portal, which is running and answers `color-scheme` with 1 (prefer dark) on
# org.freedesktop.appearance -- that is what libadwaita reads, and what GTK
# itself now tracks through gtk-interface-color-scheme. The value behind it is
# `gsettings get org.gnome.desktop.interface color-scheme`, 'prefer-dark' here.
# Change it there and every GTK4 app follows; writing it here only produced a
# warning.

gtk-icon-theme-name=Adwaita
# NOT the name of a cursor theme, and not a mistake: `default` is a theme that
# exists, in ~/.icons/default, and it is one line -- an index.theme whose
# Inherits= points at whatever the wallpaper chose. desktop-tweak rewrites it
# on every change.
#
# THE INDIRECTION IS THE POINT. This file is tracked in git and the cursor
# theme changes every time the wallpaper does, so naming the real theme here
# would mean a modified file in the repository every half hour. A fixed name
# keeps this file still while the pointer keeps up.
#
# AND THIS LINE MATTERS TO EXACTLY ONE APPLICATION. GTK programs obey gsettings
# through the settings portal, not this file -- see the note at the top -- so
# it looked redundant and said "Adwaita" for a year. The Steam client runs
# inside the Steam Runtime container, where there is no portal, and its
# embedded browser reads this file instead: it was asking for Adwaita, getting
# Adwaita, and the pointer went plain the moment it crossed into Steam's
# window. Found with inotifywait on the theme directories, after a long
# afternoon of guessing at everything else.
gtk-cursor-theme-name=default
gtk-cursor-theme-size=24

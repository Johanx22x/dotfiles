[Settings]
# adw-gtk3-dark (package adw-gtk-theme, repo extra): the libadwaita theme
# ported to GTK3. It is used instead of the built-in Adwaita because Adwaita
# GTK3 hardcodes its colours, while this one reads @define-color -- so the
# palette is the list of names in ~/.config/gtk-3.0/gtk.css and not a patch
# full of selectors. See the header of matugen's gtk3-colors.css.
#
# NOTE: this file is not the last word. gsettings
# (org.gnome.desktop.interface gtk-theme) wins over it when a settings portal
# is running, which is the case here -- both have to say the same thing.
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1

gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

# Drop the client-side title bar where possible: Hyprland already draws the
# border and it looks cleaner.
gtk-decoration-layout=appmenu:none

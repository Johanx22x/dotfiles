[Settings]
# Adwaita viene compilado dentro de GTK3, no hay que instalar ningun tema.
# prefer-dark hace que use su variante oscura (Adwaita-dark).
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1

gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

# Quita la barra de titulo del cliente donde se pueda: Hyprland ya
# dibuja el borde y se ve mas limpio.
gtk-decoration-layout=appmenu:none

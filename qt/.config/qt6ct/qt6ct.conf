[Appearance]
# icon_theme=Adwaita and NOT breeze-dark. GTK is already on Adwaita
# (gtk-3.0/settings.ini), and having Qt on a different theme is not just an
# inconsistency between toolkits: everything that asks Qt for an icon by name
# resolves against THIS theme. The tray menus are the visible case --
# blueman's entries ask for bluetooth-symbolic and application-x-addon-symbolic,
# which exist in Adwaita but not in breeze-dark, and Quickshell's icon provider
# answers a missing icon with a magenta chequerboard placeholder rather than
# with nothing. Adwaita, matching GTK, resolves all of them.
color_scheme_path=/home/johan/.config/qt6ct/colors/matugen.conf
custom_palette=true
icon_theme=Adwaita
standard_dialogs=default
style=Fusion

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
dialog_buttons_have_icons=1
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[SettingsWindow]
geometry=@ByteArray(\x1\xd9\xd0\xcb\0\x3\0\0\0\0\x4\x38\0\0\0\xf0\0\0\t\x1a\0\0\x6#\0\0\x4\x38\0\0\0\xf0\0\0\t\x1a\0\0\x6#\0\0\0\x1\x2\0\0\0\n\0\0\0\x4\x38\0\0\0\xf0\0\0\t\x1a\0\0\x6#)

# ranger - gestor de archivos de terminal
#
# Esto NO es la config entera: ranger carga primero su rc.conf global
# (/usr/share/doc/ranger/config/rc.conf) y luego este encima. Aqui solo
# van las diferencias, igual que kitty/colors.conf o waybar/colors.css.
# Para ver todo lo que se puede tocar, mira el archivo global.

# ---- Color ----
# El acento sale del wallpaper via matugen; el resto son los 16 ANSI de
# kitty. Ver ~/.config/ranger/colorschemes/tokyonight.py.
set colorscheme tokyonight

# ---- Miniaturas ----
# Metodo "kitty": las imagenes se dibujan con el protocolo grafico de la
# propia terminal. Es la razon de no instalar ueberzugpp -- kitty ya
# sabe hacerlo y una dependencia menos que mantener.
#
# OJO: esto ata ranger a kitty. En otra terminal (una TTY, o si algun
# dia entra foot) las miniaturas no salen, pero ranger sigue
# funcionando: solo se queda sin la vista previa de imagenes.
#
# Necesita python-pillow, que ya estaba instalado.
set preview_images true
set preview_images_method kitty

# scope.sh es el script de previsualizacion que trae ranger; genera las
# vistas de PDF, video, archivos comprimidos y codigo con sintaxis.
# Se copia de /usr/share/doc/ranger/config/ en la instalacion.
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh

# ---- Interfaz ----
# Bordes en las tres columnas: separa la vista previa del listado, que
# con fondo translucido (kitty va a background_opacity 0.70) si no
# cuesta ver donde acaba cada panel.
set draw_borders both

# El nombre del directorio en la pestana en vez del numero.
set dirname_in_tabs true

# Confirmar el borrado solo cuando hay varios archivos o un directorio.
# "always" acaba en pulsar "y" por reflejo, que es justo lo que no
# quieres el dia que te equivocas de archivo.
set confirm_on_delete multiple

# ---- Papelera ----
# "delete", que es lo que trae DD de serie, es rm -rf sin vuelta atras.
# Nautilus en cambio manda a la papelera, y tener las dos mitades del
# gestor de archivos comportandose distinto ante la misma tecla es como
# se pierde un directorio.
#
# Asi que DD pasa a la papelera (gio es de glib2, y el backend de
# papelera lo pone gvfs, que ya arrastra nautilus) y el borrado
# definitivo se mueve a Dr -- "delete really", que hay que buscarla.
map DD shell gio trash -- %s
map Dr delete

# ranger - terminal file manager
#
# This is NOT the whole config: ranger loads its global rc.conf first
# (/usr/share/doc/ranger/config/rc.conf) and then this one on top. Only the
# differences go here, same as kitty/colors.conf or waybar/colors.css.
# To see everything that can be tweaked, look at the global file.

# ---- Colour ----
# The accent comes from the wallpaper via matugen; everything else is kitty's
# 16 ANSI colours. See ~/.config/ranger/colorschemes/tokyonight.py.
set colorscheme tokyonight

# ---- Thumbnails ----
# "kitty" method: images are drawn with the terminal's own graphics
# protocol. That is the reason not to install ueberzugpp -- kitty already
# knows how, and it is one dependency fewer to maintain.
#
# CAREFUL: this ties ranger to kitty. In another terminal (a TTY, or foot if
# it ever shows up) thumbnails do not appear, but ranger keeps working: it
# just loses the image preview.
#
# Needs python-pillow, which was already installed.
set preview_images true
set preview_images_method kitty

# scope.sh is the preview script shipped with ranger; it produces the
# previews for PDF, video, archives and syntax-highlighted code.
# It is copied from /usr/share/doc/ranger/config/ at install time.
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh

# ---- Interface ----
# Borders on the three columns: separates the preview from the listing,
# which with a translucent background (kitty runs at background_opacity 0.70)
# is otherwise hard to tell apart.
set draw_borders both

# The directory name in the tab instead of the number.
set dirname_in_tabs true

# Confirm deletion only when there are several files or a directory.
# "always" ends in hitting "y" by reflex, which is exactly what you do not
# want the day you pick the wrong file.
set confirm_on_delete multiple

# ---- Trash ----
# "delete", which is what DD does out of the box, is rm -rf with no way
# back. Nautilus on the other hand moves to trash, and having the two halves
# of your file management behave differently on the same key is how a
# directory goes missing.
#
# So DD now moves to trash (gio comes from glib2, and the trash backend from
# gvfs, which nautilus already pulls in) and permanent deletion moves to
# Dr -- "delete really", which you have to go looking for.
map DD shell gio trash -- %s
map Dr delete

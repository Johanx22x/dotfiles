# Config de reflector. La usa reflector.service (disparado por reflector.timer).
# Sin filtro de pais a proposito: --sort rate ya mide la velocidad real desde
# aqui, y fijar un pais puede dejar fuera mirrors mas rapidos al otro lado de
# la frontera. Solo https, y solo los sincronizados en las ultimas 12 h.
--save /etc/pacman.d/mirrorlist
--protocol https
--latest 20
--age 12
--sort rate

# Escrito el 1 ago 2026. Antes de esto no existia NINGUNA configuracion de
# SDDM: ni /etc/sddm.conf ni este directorio.
#
# No se toca DisplayServer a proposito. Por defecto es x11 y asi funciona
# (Xorg arranca en vt2 y el greeter va encima). El greeter Wayland necesitaria
# un compositor -- weston, que no esta instalado -- y no hay nada que ganar.

[Theme]
Current=sword

# El greeter no hereda las variables del usuario, asi que XCURSOR_THEME no le
# llega. Sin esto sale el cursor X por defecto, el de la cruz negra.
CursorTheme=Adwaita
CursorSize=24

[General]
Numlock=on

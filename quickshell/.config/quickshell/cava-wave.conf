# cava, and there is only one. Read by modules/island/Spectrum.qml, which
# publishes what comes out of it to both things that draw a spectrum: the
# dashboard's ground and the island's capsule.
#
# IT WAS TWO CONFIGS AND TWO PROCESSES. `cava.conf` next door drove the
# island's fourteen fat bars and this drove the dashboard's continuous wave,
# and that was right for exactly as long as the two wanted different shapes --
# a wave built from fourteen points is a zigzag, so sharing one feed would
# have meant one of them being wrong. The island draws the same wave now, so
# both want the same thing; `cava.conf` and modules/island/Waveform.qml are
# gone and this is the shell's only cava.
#
# THE NAME KEEPS ITS SUFFIX even though nothing sits beside it, because the
# distinction it was drawing is still real: this is not ~/.config/cava/config,
# which belongs to cava run as a terminal program.
#
# The settings are end-4/dots-hyprland's, from
# dots/.config/quickshell/ii/scripts/cava/raw_output_config.txt, because the
# card is a port of theirs and the shape of the wave is mostly a function of
# these.
#
# COST: one process, running whenever something is playing. It used to be two
# -- this one gated on the dashboard being open, and the island's gated on
# playback -- so the shell now runs strictly less than it did: the island's
# cava was always the one that ran all the time, and it is the one that
# survived. Band count does not enter into it: cava runs the same FFT
# whatever `bars` says and only bins the result differently.

[general]
# EIGHTY, AND IT WAS end-4's FIFTY, AND IT NOW HAS TO SERVE TWO CONSUMERS OF
# very different widths. What decides the number is how many pixels one
# segment of the drawing gets, not how many bands music has:
#
#   theirs      a 420px card                ->  50 points, 8.4 px a segment
#   dashboard   the wave spans about 780px  ->  80 points, 9.8 px a segment
#   island      a capsule 250 to 420px      ->  80 points, 3 to 5 px
#
# Eighty holds their density at the panel's width, and leaves the island finer
# than it needs to be rather than coarser than it can afford -- which is the
# right way round, because a wave with more points than pixels still reads as
# a wave and one with fewer reads as a chain of straight lines. It is NOT
# taken further: bands are frequency bins, not resolution, and doubling again
# would change what the wave is SHOWING -- a finer, spikier reading of the
# spectrum -- rather than only how smoothly it is drawn.
#
# This is a number chosen by arithmetic on segment length and not seen
# rendered.
bars = 80

# Theirs. Not a real key in cava 0.10.7 -- the parser ignores it without a
# warning, checked by running this file -- and it is kept only because it is
# in theirs and costs nothing. The actual smoothing is noise_reduction below.
mode = waves

framerate = 60

# Ride the gain, so a quiet track still fills the card.
autosens = 1

[input]
# Stated rather than left to auto-detect. Theirs omits this section entirely,
# and letting it auto-detect on a machine with a dozen PipeWire nodes is how a
# visualiser ends up animating the wrong sink.
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii

# STATED, THOUGH THEIRS LEAVES IT DEFAULTED. Their WaveVisualizer divides by a
# hardcoded 1000, which is cava's own default for this key -- so theirs works
# by agreeing with a default rather than by saying so. Writing it down here
# means the QML's maxVisualizerValue and this file cannot drift apart without
# one of them being edited.
ascii_max_range = 1000

# One set of bands, averaged across the channels. Theirs.
channels = mono
mono_option = average

[smoothing]
# Theirs, and on the scale cava 0.10.7 actually uses: this key is an int from
# 0 to 100, default 77. Twenty is a long way below that on purpose -- a wave
# is meant to move, and the island's bars are meant to settle.
#
# cava.conf next door had this key under [general], where cava does not read
# it. That file is gone with the bars it fed, and the measurement that showed
# the key was being ignored is in the commit that fixed it.
noise_reduction = 20

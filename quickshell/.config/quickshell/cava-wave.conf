# cava, driving the media card's WAVE. Read by modules/island/Dashboard.qml.
#
# A second cava config beside cava.conf, and a second cava process, because
# the two visualisers in this shell want genuinely different numbers. The
# island draws 14 fat bars in a capsule; this draws one continuous wave across
# a 420px card, and a wave built from 14 points is a zigzag. Sharing one feed
# would mean one of them being wrong.
#
# The settings are end-4/dots-hyprland's, from
# dots/.config/quickshell/ii/scripts/cava/raw_output_config.txt, because the
# card is a port of theirs and the shape of the wave is mostly a function of
# these.
#
# COST: this process only exists while the dashboard is open AND something is
# playing -- the panel destroys its content on close, and the Process is
# gated on playback the way Spectrum.qml is. Theirs is gated on their media
# popup being open, which is the same bargain.

[general]
# Theirs. Fifty points is what makes the wave read as a curve rather than as
# a chain of segments.
bars = 50

# Theirs. Not a real key in cava 0.10.7 -- the parser ignores it without a
# warning, checked by running this file -- and it is kept only because it is
# in theirs and costs nothing. The actual smoothing is noise_reduction below.
mode = waves

framerate = 60

# Ride the gain, so a quiet track still fills the card.
autosens = 1

[input]
# Stated rather than left to auto-detect, matching cava.conf. Theirs omits
# this section entirely.
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii

# STATED, THOUGH THEIRS LEAVES IT DEFAULTED. Their WaveVisualizer divides by a
# hardcoded 1000, which is cava's own default for this key -- so theirs works
# by agreeing with a default rather than by saying so. Writing it down here
# means the QML's maxVisualizerValue and this file cannot drift apart without
# one of them being edited.
ascii_max_range = 1000

# One set of bands, averaged across the channels. Theirs.
channels = mono
mono_option = average

[smoothing]
# Theirs, and on the scale cava 0.10.7 actually uses: this key is an int from
# 0 to 100, default 77. Note cava.conf next door says 0.77, which was the OLD
# float scale and now reads as zero -- that is a separate thing and is left
# alone here rather than changed in passing.
noise_reduction = 20

# cava, driving the dashboard's WAVE. Read by modules/island/Dashboard.qml.
#
# A second cava config beside cava.conf, and a second cava process, because
# the two visualisers in this shell want genuinely different numbers. The
# island draws 14 fat bars in a capsule; this draws one continuous wave, and a
# wave built from 14 points is a zigzag. Sharing one feed would mean one of
# them being wrong.
#
# WHY EACH HAS THE NUMBER IT HAS. The question is not "how many bands does
# music have", it is how many PIXELS one segment of the drawing gets:
#
#   island   14 bars, 4 wide with 3 between  ->  7 px of capsule each
#   here     the wave spans the whole panel  ->  see below
#
# The island's number is set by the bar being legible as a bar and by the
# capsule being shared with the track title; nothing about that changed, so
# nothing about 14 changed either.
#
# The settings are end-4/dots-hyprland's, from
# dots/.config/quickshell/ii/scripts/cava/raw_output_config.txt, because the
# card is a port of theirs and the shape of the wave is mostly a function of
# these.
#
# COST: this process only exists while the dashboard is open AND something is
# playing -- the panel destroys its content on close, and the Process is
# gated on playback the way Spectrum.qml is. Theirs is gated on their media
# popup being open, which is the same bargain. Going from 50 bands to 80 does
# not move that: cava runs the same FFT either way and only bins the result
# differently.

[general]
# EIGHTY, AND IT WAS end-4's FIFTY, because what consumes it stopped being a
# card and became a panel. Theirs is 420px wide, which gives their 50 points
# 8.4 pixels of travel each -- fine enough that the fill reads as a curve.
# The wall spans the whole dashboard, about 1014px, and the same 50 points
# would be 20 pixels apart: a chain of visible straight segments that the
# blur below can soften but cannot bend.
#
# Eighty puts a segment back at 12.7 pixels, between their density and the
# raw stretch. It is NOT taken further: bands are frequency bins, not
# resolution, and doubling them again would change what the wave is showing
# -- a finer, spikier reading of the spectrum -- rather than only how
# smoothly it is drawn. This is a number I chose by arithmetic on segment
# length and did not see rendered.
bars = 80

# Theirs. Not a real key in cava 0.10.7 -- the parser ignores it without a
# warning, checked by running this file -- and it is kept only because it is
# in theirs and costs nothing. The actual smoothing is noise_reduction below.
mode = waves

framerate = 60

# Ride the gain, so a quiet track still fills the card.
autosens = 1

[input]
# Stated rather than left to auto-detect, matching cava.conf. Theirs omits
# this section entirely.
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii

# STATED, THOUGH THEIRS LEAVES IT DEFAULTED. Their WaveVisualizer divides by a
# hardcoded 1000, which is cava's own default for this key -- so theirs works
# by agreeing with a default rather than by saying so. Writing it down here
# means the QML's maxVisualizerValue and this file cannot drift apart without
# one of them being edited.
ascii_max_range = 1000

# One set of bands, averaged across the channels. Theirs.
channels = mono
mono_option = average

[smoothing]
# Theirs, and on the scale cava 0.10.7 actually uses: this key is an int from
# 0 to 100, default 77. Twenty is a long way below that on purpose -- a wave
# is meant to move, and the island's bars are meant to settle.
#
# cava.conf next door had this key under [general], where cava does not read
# it; that is fixed there now, with the measurement that showed it was being
# ignored.
noise_reduction = 20

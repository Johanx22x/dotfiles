# cava, driving the island's waveform. Read by modules/island/Spectrum.qml.
#
# Kept HERE and passed explicitly with `cava -p`, not in ~/.config/cava/:
# that path belongs to cava run as a terminal program, and this file is a
# component of the shell. Sharing one file would mean the island's bar count
# and the one you get by typing `cava` are the same number, which they should
# not be.

[general]
# Bars the island draws. Small on purpose: the waveform shares the capsule
# with the track title, and past this the bars stop being distinguishable and
# turn into a smear.
bars = 14

# The output is only ever read to set a height, so there is no point
# producing frames faster than the compositor shows them.
framerate = 60

# Ride the gain automatically: a quiet track and a loud one should both fill
# the capsule, because the island is showing "there is sound", not decibels.
autosens = 1

# Trim the very bottom of the range. Without it, the noise floor of a paused
# stream keeps the bars twitching.
noise_reduction = 0.77

[input]
# PipeWire directly, no intermediate loopback device.
method = pipewire
source = auto

[output]
# Raw numbers on stdout, which the shell reads through a Process. `ascii`
# rather than `binary`: one line per frame, values separated by ';', which is
# parseable in QML without a byte-order dance for the sake of a few numbers.
method = raw
raw_target = /dev/stdout
data_format = ascii

# 0..100 per bar, so the QML divides by a round number.
ascii_max_range = 100

# One set of bars, not a mirrored stereo pair: the capsule is too narrow to
# read two channels, and left-versus-right is not information anyone acts on.
channels = mono

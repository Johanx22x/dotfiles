# The two input method variables that are still needed on Wayland, and the one
# that is deliberately absent. Needs packages/optional/input-method.txt; with
# no fcitx5 installed these are three strings nothing reads, which is why the
# file is linked unconditionally and not behind a check.
#
# WHY HERE AND NOT IN THE COMPOSITOR'S CONFIG, which is the opposite of the
# answer 10-path.conf beside this file had to give. PATH could not live in
# niri's `environment` block because niri expands nothing and the value needs
# $HOME. These two values are literal strings, so niri COULD hold them -- and
# one file that niri and Hyprland both read is still the better answer. An IME
# that works under one compositor and not the other is a bug that costs an
# afternoon to find, and this repository is installed under either.
#
# WHAT IMPORT-ENVIRONMENT DOES TO THIS FILE, and why it is survivable here
# when it was not for PATH. niri-session runs `systemctl --user
# import-environment` with no arguments, which copies the login shell's whole
# environment over the manager's own -- that is what defeats 10-path.conf and
# why .zshenv is the line of defence that actually holds for PATH. Nothing on
# this machine puts XMODIFIERS or QT_IM_MODULES in a login shell, so there is
# no competing value to lose to, and what the generator writes here is what
# the session ends up with. Verify after a change with
#   systemctl --user show-environment | grep -E 'XMODIFIERS|QT_IM'
# and if either is missing, the shell has started setting it and this file is
# no longer enough on its own.
#
# XMODIFIERS IS FOR XWAYLAND AND NOTHING ELSE. Native Wayland clients never
# read it; it is how an X11 client finds fcitx5's built-in XIM server. Without
# it everything still on XWayland -- Steam, Discord -- takes romaji and
# converts nothing, while the rest of the desktop is fine, which is a
# confusing way to discover it is missing.
#
# QT_IM_MODULES IS PLURAL AND THAT IS NOT A TYPO. Qt 6.8 added a fallback
# chain under that name; the older singular QT_IM_MODULE takes one value and
# is what every older forum post names. This machine has qt6-base 6.11.2, so
# `wayland` goes first and Qt talks text-input-v3 to the compositor itself,
# with fcitx5's platform input context behind it for a Qt that cannot. fcitx5
# documents three different answers here -- one for Qt < 6.7, one for
# 6.7-6.8.1 which it says to avoid outright, and this one for 6.8.2 and up --
# so the Qt version is worth re-reading before touching the line:
# https://fcitx-im.org/wiki/Using_Fcitx_5_on_Wayland
#
# GTK_IM_MODULE IS ABSENT ON PURPOSE AND ITS ABSENCE IS THE SETTING. fcitx5's
# own documentation says not to set it. GTK 3.24 and GTK 4 use their own
# Wayland input module and talk text-input-v3; forcing them through fcitx5's
# module instead only takes away the path that already works. It is also the
# first thing every forum answer tells you to add, which is the whole reason
# this paragraph exists -- putting it back is a change to argue for, not a fix.
XMODIFIERS=@im=fcitx
QT_IM_MODULES=wayland;fcitx

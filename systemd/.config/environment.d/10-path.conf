# ~/.local/bin on PATH, for the whole graphical session. SECOND LINE OF DEFENCE.
#
# The first one is zsh/.zshenv, and it is the one that actually holds under
# niri. What is written here is generated correctly at user-manager start --
# verified by running
# /usr/lib/systemd/user-environment-generators/30-systemd-environment-d-generator
# by hand -- and then thrown away a moment later: niri-session runs
# `systemctl --user import-environment` with no arguments, which copies the
# login shell's whole environment over the manager's own, PATH included.
# Measured on this machine: the generator prints the right PATH while
# `systemctl --user show-environment` prints one without ~/.local/bin.
#
# So this file is kept for the sessions that do NOT go through a login shell,
# where it is the only thing setting PATH, and .zshenv covers the ones that do.
# Neither of them is redundant on its own.
#
# WHY NOT THE COMPOSITOR'S CONFIG. Hyprland can set it itself, in hyprland.lua,
# by reading its own PATH and prepending to it -- Lua can do that. niri cannot:
# its `environment` block does NOT expand anything, measured by reading the
# value back out of a spawned process, which came out as the literal
# "~/.local/bin". So a portable answer cannot live in the niri config, because
# the only thing that would work there is this machine's absolute home, and this
# repository is shared with another machine and another user.
#
# WHAT IT COSTS TO GET WRONG: the shell calls its own scripts BY NAME --
# `wallpaper-switch`, `desktop-tweak`, `night-light` -- so without this they are
# simply not found, and the buttons that call them do nothing at all with no
# error anywhere. That is how changing the wallpaper from the settings window
# came to silently fail under niri, and then the night light after it.
PATH=$HOME/.local/bin:$PATH

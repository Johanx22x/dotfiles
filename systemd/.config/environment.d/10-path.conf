# ~/.local/bin on PATH, for the whole graphical session.
#
# WHY HERE AND NOT IN THE COMPOSITOR'S CONFIG. Hyprland sets it itself, in
# hyprland.lua, by reading its own PATH and prepending to it -- Lua can do that.
# niri cannot: its `environment` block does NOT expand anything, measured by
# reading the value back out of a spawned process, which came out as the literal
# "~/.local/bin". So a portable answer cannot live in the niri config, because
# the only thing that would work there is this machine's absolute home, and this
# repository is shared with another machine and another user.
#
# systemd reads this file for the user session, expands $HOME, and hands the
# result to whatever the session starts -- compositor included. That makes it
# the one place that serves every flavor, this one and the next.
#
# WHAT IT COSTS TO GET WRONG: the shell calls its own scripts BY NAME --
# `wallpaper-switch`, `desktop-tweak`, `night-light` -- so without this they are
# simply not found, and the buttons that call them do nothing at all with no
# error anywhere. That is how changing the wallpaper from the settings window
# came to silently fail under niri while the same script worked from a terminal.
PATH=$HOME/.local/bin:$PATH

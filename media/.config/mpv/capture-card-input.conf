# Key bindings for the capture card window only.
# Loaded with --input-conf from ~/.local/bin/capture-card.
# mpv's built-in bindings (f fullscreen, q quit) stay active: this adds to
# the factory ones, it does not replace them.
#
# The audio goes through a PipeWire loopback rather than mpv, so these keys
# do not use mpv's volume commands but the script acting on the loopback
# stream.
#
# The commands go through /bin/sh on purpose: mpv's `run` does not call a
# shell and only expands ${property}, so neither ~ nor $HOME would be
# expanded and the command would have to be an absolute path. Handing the
# line to sh gets the script looked up in PATH instead, which keeps this
# file free of any hardcoded home directory.

m           run "/bin/sh" "-c" "capture-card-audio toggle"
0           run "/bin/sh" "-c" "capture-card-audio up"
9           run "/bin/sh" "-c" "capture-card-audio down"
UP          run "/bin/sh" "-c" "capture-card-audio up"
DOWN        run "/bin/sh" "-c" "capture-card-audio down"

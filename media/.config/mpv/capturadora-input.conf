# Atajos solo para la ventana de la capturadora.
# Se carga con --input-conf desde ~/.local/bin/capturadora.
# Los atajos internos de mpv (f pantalla completa, q salir) siguen activos:
# esto se suma a los de fabrica, no los reemplaza.
#
# El audio va por un loopback de PipeWire y no por mpv, asi que estas teclas
# no usan los comandos de volumen de mpv, sino el script que actua sobre el
# flujo del loopback.

m           run "/home/johan/.local/bin/capturadora-audio" "toggle"
0           run "/home/johan/.local/bin/capturadora-audio" "up"
9           run "/home/johan/.local/bin/capturadora-audio" "down"
UP          run "/home/johan/.local/bin/capturadora-audio" "up"
DOWN        run "/home/johan/.local/bin/capturadora-audio" "down"

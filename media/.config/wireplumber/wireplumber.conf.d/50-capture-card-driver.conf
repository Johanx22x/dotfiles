# =============================================================
#  Who owns the clock in the capture-card graph
#
#  The `capture-card` script joins the card and the headphones with a
#  pw-loopback, and pw-loopback puts both of its nodes in one node.group. Every
#  node linked together shares a single driver, so card, loopback and output end
#  up in ONE graph with ONE clock. Whichever node does not own that clock has to
#  adapt to it, and the highest priority.driver is what decides.
#
#  Defaults computed by /usr/share/wireplumber/scripts/monitors/{alsa,bluez}.lua:
#    capture card  1000 (dev 0) + 1000 (capture) + 9 (analog-) + 100 (usb) = 2109
#    G435 headset  1000          +   0            + 9           + 100      = 1109
#    A2DP sink                                                               1010
#
#  The card must stay ABOVE wired outputs and BELOW Bluetooth, and 1010 < 1109,
#  so no single number on the card can do both. The card keeps its default and
#  Bluetooth is lifted over it instead.
#
#  --- Why the card must own the clock over a wired output --------------------
#
#  This file used to drop the card to priority.driver = 100 so it never drove
#  anything. That is backwards, and pipewire-props(7) says so under
#  priority.driver: "adaptive resampling should be done on the sinks rather than
#  the source to avoid signal distortion when capturing audio."
#
#  As a follower the card has to rate-match the output's clock. Whenever the
#  graph is reconfigured — another app appearing or disappearing with a
#  different node.latency, or switching output device — the quantum changes, the
#  follower's delay target jumps, and alsa_read_sync gives up and hard-resyncs,
#  dropping or repeating samples. That is the crackling you hear on the capture
#  card after touching audio anywhere else.
#
#  Measured on this machine (pipewire 1.6.8), forcing the quantum through
#  1024/256/2048/480/1024/512 and then switching output device, counting resync
#  events in the pipewire log:
#
#    card demoted to 100  ->  443 resyncs, all alsa_read_sync  (the card)
#    card at its default  ->    9 resyncs, all alsa_write_sync (the output)
#
#  Same disturbance, ~50x fewer glitches, and the ones left land on the playback
#  side where a dropped sample is inaudible instead of on the captured signal.
#  With the card driving, its own node reports follower:0 match:0 — it no longer
#  rate-matches anything, so nothing can make it resync.
#
#  Opening and closing the viewer three times over audio already playing on the
#  wired headset cost one playback-side resync per transition and no suspend or
#  resume of the sink, so the card taking the clock does not interrupt whatever
#  else is playing.
#
#  --- Why Bluetooth is the exception ------------------------------------------
#
#  With an A2DP sink the card driving is the worse end of the trade. Opening and
#  closing the viewer re-drives the graph, and each transition stops and
#  restarts the A2DP sink: the headphones go quiet for a moment and take along
#  whatever else was playing on them. On top of that the card drives at a
#  256-frame quantum (5.3 ms), far tighter than Bluetooth wants, which showed up
#  as xruns on both nodes.
#
#  So bluez_output goes to 2200, above the card's 2109, and only there does the
#  output keep the clock. Not verified by measurement: the AirPods were not
#  connected when this was written, so this half is reasoned from the priorities
#  above, not observed.
#
#  Trade-off accepted: any bluez_output now outranks USB sources (2109) in every
#  graph, not just this one. Recording the NZXT mic while listening on the
#  AirPods makes the mic the follower instead of the headphones. A2DP is clocked
#  off the system timer rather than a crystal, so it is a steady thing to follow,
#  but if mic recordings over Bluetooth ever sound off, this is why.
#
#  Only priority.driver is overridden. Rules are applied after the monitor
#  scripts compute their defaults, so priority.session — which is what ranks
#  devices in the output list — keeps its own value.
# =============================================================

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output\\..*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 2200
      }
    }
  }
]

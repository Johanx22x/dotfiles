# =============================================================
#  Keep the capture card from driving the graph
#
#  WirePlumber gives every ALSA node a priority.driver, and inside one graph
#  the highest number owns the clock. A USB analog capture device adds up to
#  1000 (device 0) + 1000 (capture) + 9 (analog-) + 100 (usb) = 2109, while
#  the A2DP sink of a Bluetooth headset only gets 1010
#  (/usr/share/wireplumber/scripts/monitors/alsa.lua and bluez.lua).
#
#  The `capture-card` script joins the two with a pw-loopback, so card and
#  headphones land in the SAME graph and the card, being the higher number,
#  takes the clock away from them. Opening the viewer re-drives the graph onto
#  the card and closing it hands the clock back, and each of those two
#  transitions stops and restarts the A2DP sink: the headphones go quiet for a
#  moment and take along whatever else was playing on them. On top of that the
#  card drives at a 256-frame quantum (5.3 ms), far tighter than Bluetooth
#  wants, which shows up as xruns on both nodes.
#
#  Dropping the card below every output leaves the clock where it belongs, on
#  whatever is playing the sound, and the card gets resampled onto it, which is
#  what PipeWire does for any non-driver device anyway. With no loopback (OBS
#  recording only the card) it is still the only node in its graph, so it keeps
#  driving and nothing is lost there.
#
#  100 sits below every output on this machine: HDMI ~696, S/PDIF 1008,
#  A2DP 1010, USB headset 1109.
#
#  Only priority.driver is overridden. priority.session, which is what decides
#  the default source, keeps its 2109 so the card ranks the same as before in
#  the input list.
# =============================================================

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-NZXT_NZXT_Signal_HD60.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 100
      }
    }
  }
]

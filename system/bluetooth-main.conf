# /etc/bluetooth/main.conf -- the two lines this desktop needs changed.
#
# Everything else in that file is left at the distribution default; only the
# settings below are edited. Apply them by hand, as with the rest of system/:
#
#   sudo sed -i 's/^#FastConnectable = false/FastConnectable = true/' \
#     /etc/bluetooth/main.conf
#   sudo sed -i 's/^#AutoEnable=true/AutoEnable=true/' /etc/bluetooth/main.conf
#   sudo systemctl restart bluetooth
#
# FastConnectable = true
# ----------------------
# WHY: a PS5 controller would not come back on its own. Pressing the PS button
# did nothing and it had to be put into pairing mode and paired again, every
# time -- and re-pairing is not a fix, it is doing the setup once per use.
#
# With FastConnectable off, which is the default, the adapter page-scans on a
# long, power-saving interval. A DualSense pressing its button tries to
# reconnect for a short window and then gives up, and the two rarely overlap.
# Turning it on makes the adapter listen aggressively enough that the
# controller finds it. The cost is real and small: the bluetooth radio uses
# more power while idle, which on a desktop plugged into the wall is not a
# cost at all. On a laptop, think about it.
#
# NOT A SUBSTITUTE FOR TRUSTING THE DEVICE. Those are two different failures
# that look alike. An untrusted device connects and then BlueZ does not bring
# its profiles up -- that is what made the AirPods connect with no audio and
# the controller connect with no input, and the shell now sets `trusted` on
# every device it pairs or connects. FastConnectable is about the device
# reaching the host in the first place. A controller needs both.
#
# AutoEnable=true
# ---------------
# Brings the adapters up after a reboot without anyone asking. Under [Policy].

# Written on 2026-08-01. Before this there was NO SDDM configuration at all:
# neither /etc/sddm.conf nor this directory existed.
#
# DisplayServer is deliberately left alone. It defaults to x11 and works that
# way (Xorg starts on vt2 and the greeter runs on top). The Wayland greeter
# would need a compositor -- weston, which is not installed -- and there is
# nothing to gain.

[Theme]
Current=sword

# The greeter does not inherit the user environment, so XCURSOR_THEME never
# reaches it. Without this you get the default X cursor, the black cross.
CursorTheme=Adwaita
CursorSize=24

[General]
Numlock=on

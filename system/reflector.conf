# reflector config, used by reflector.service (triggered by reflector.timer).
# No country filter on purpose: --sort rate already measures the real speed
# from here, and pinning a country can rule out faster mirrors just across
# the border. https only, and only mirrors synced in the last 12 h.
--save /etc/pacman.d/mirrorlist
--protocol https
--latest 20
--age 12
--sort rate

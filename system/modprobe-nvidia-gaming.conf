# KMS: mandatory for Wayland. It is the default from 610 on, pinned explicitly.
options nvidia_drm modeset=1 fbdev=1

# Keeps the VRAM across suspend: without this, coming back from suspend leaves
# textures corrupted or crashes the game.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp

# Lets games use more mapped system memory.
options nvidia NVreg_UsePageAttributeTable=1

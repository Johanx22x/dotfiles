# MangoHud overlay, tuned for diagnosing the "sudden 15 fps" problem.
#
# VRAM is the number to watch. On NVIDIA under Linux there is no shared-memory
# fallback: when the card runs out of video memory the driver cannot spill to
# system RAM the way Windows does, so the frame rate collapses and does NOT
# recover until the game is restarted. If `VRAM` is pinned near the card's
# total at the moment the stutter starts, that is the cause.
#
# Read by both mangohud and mangoapp (gamescope's --mangoapp / GS_HUD=1).

fps
frametime
frame_timing=1

# The GPU block: low `GPU` usage together with high `VRAM` is the signature of
# memory exhaustion rather than a GPU bottleneck.
gpu_stats
gpu_temp
gpu_power
gpu_mem_clock
vram

# The dedicated card only. Without this the HUD also lists the UHD 770 in the
# CPU, which drives no monitor here and never renders anything -- it showed up
# as a row of zeroes: 0%, 0 degrees, 0.0 GiB of VRAM, 0 MHz.
#
# INDEX 0 IS THE RTX 5070. MangoHud enumerates by RENDER NODE, not by card
# number, and on this machine those two orders disagree:
#
#   renderD128 = NVIDIA RTX 5070   card1   0000:01:00.0
#   renderD129 = Intel UHD 770     card0   0000:00:02.0
#
# Reading it off card* gives 1 and puts the iGPU on screen, which is exactly
# what happened the first time.
#
# `pci_dev=0000:01:00.0` WOULD ALSO WORK, and a note here used to say it would
# not. That note was wrong and it was wrong in an instructive way: it claimed
# the string is absent from the binary, which is what `strings ... | grep -x`
# reports, because the linker merges the key into the tail of a longer one.
#
#   $ strings /usr/bin/mangoapp | grep -x pci_dev          -> nothing
#   $ strings /usr/bin/mangoapp | grep -c pci_dev          -> 7
#   $ dd if=/usr/bin/mangoapp bs=1 skip=2915053 count=20 | tr '\0' '\n'
#     verify_pci_dev
#     pci_dev = {}
#
# "pci_dev" is the last seven bytes of "verify_pci_dev", and the option parser
# points at exactly that address: set_parameters_from_options at 0x66436 loads
# 0x2c7af4 and calls operator==(std::string const&, char const*) on it. The
# binary also carries "You have specified both gpu_list and pci_dev, ignoring
# pci_dev.", a sentence that only exists because both are honoured. Same in
# /usr/lib/mangohud/libMangoHud.so, which is the other half of this file's
# audience.
#
# GPU_LIST STAYS ANYWAY, and not out of inertia. It is what runs today and the
# index it names was checked rather than assumed, so replacing a working line
# with an untested one buys nothing. What pci_dev would buy is independence
# from the enumeration order -- MangoHud builds its list by scanning
# /sys/class/drm for renderD* and sorting the names, so index 0 is only the
# 5070 for as long as that ordering holds. The day a third GPU or a renamed
# node moves it, this line is the one to swap; the address is on line 30 and it
# is the same address the kernel reports:
#
#   $ cat /sys/class/drm/renderD128/device/uevent
#     DRIVER=nvidia  PCI_ID=10DE:2F04  PCI_SLOT_NAME=0000:01:00.0
gpu_list=0

# System side, to tell VRAM exhaustion apart from plain RAM pressure.
ram
cpu_stats
cpu_temp

position=top-left
font_size=20
background_alpha=0.4
table_columns=2

# Right Shift + F12 toggles the overlay without restarting the game.
toggle_hud=Shift_R+F12
reload_cfg=Shift_L+F4
toggle_logging=Shift_L+F2

# ---- Logging ----
# output_folder is REQUIRED for logging: without it toggle_logging is a no-op,
# which is a silent one -- the key does nothing and nothing says why.
#
# log_interval is in ms. 0 would log every single frame, and MangoHud keeps the
# rows in memory until logging stops, so an all-night session at 60 fps means
# well over a million of them sitting in RAM. 100 ms is ten samples a second:
# plenty to see frametime drift over an hour, which is what these logs are for.
#
# $HOME AND NOT A LITERAL HOME DIRECTORY, WHICH IS WHAT THIS LINE HELD. It was
# the only one in the whole repository -- `git grep -F` for it across the tree
# returned this file and nothing else -- and on any other machine it would have
# sent the logs to a path that is not the person's home, or to one that cannot
# be written at all, discovered only on the day something needed diagnosing.
#
# MangoHud expands it, which is the part worth writing down because the
# upstream example config gives an absolute path with a <USERNAME> placeholder
# and never says so. Four options go through a helper that calls
# wordexp(value, &we, 0) -- full shell word expansion, so ~ and $VAR both
# resolve. The four are named right next to each other in .rodata and the
# parser tests them in order:
#
#   output_folder  output_file  font_file  font_file_text
#
# A relative path would also be accepted, and is the wrong answer here: this
# file is read by mangoapp inside gamescope, launched by Steam, and the working
# directory in that chain is nothing anyone chose.
output_folder=$HOME/mangologs
log_interval=100

# Start hidden. gs launches mangoapp for every game so that this keybind always
# has something to toggle, and a HUD nobody asked for on top of every game is
# not what you want -- so it comes up invisible and Shift_R+F12 brings it in.
# GS_HUD=1 starts it visible instead.
no_display

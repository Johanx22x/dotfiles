# MangoHud overlay, tuned for diagnosing the "sudden 15 fps" problem.
#
# VRAM is the number to watch. On NVIDIA under Linux there is no shared-memory
# fallback: when the card runs out of video memory the driver cannot spill to
# system RAM the way Windows does, so the frame rate collapses and does NOT
# recover until the game is restarted. If `VRAM` is pinned near the card's
# total at the moment the stutter starts, that is the cause.
#
# Read by both mangohud and mangoapp (gamescope's --mangoapp / GS_HUD=1).

fps
frametime
frame_timing=1

# The GPU block: low `GPU` usage together with high `VRAM` is the signature of
# memory exhaustion rather than a GPU bottleneck.
gpu_stats
gpu_temp
gpu_power
gpu_mem_clock
vram

# The dedicated card only. Without this the HUD also lists the UHD 770 in the
# CPU, which drives no monitor here and never renders anything -- it showed up
# as a row of zeroes: 0%, 0 degrees, 0.0 GiB of VRAM, 0 MHz.
#
# INDEX 0 IS THE RTX 5070. MangoHud enumerates by RENDER NODE, not by card
# number, and on this machine those two orders disagree:
#
#   renderD128 = NVIDIA RTX 5070   card1   0000:01:00.0
#   renderD129 = Intel UHD 770     card0   0000:00:02.0
#
# Reading it off card* gives 1 and puts the iGPU on screen, which is exactly
# what happened the first time.
#
# `pci_dev`, which the shipped example config documents for precisely this job,
# is NOT an option mangoapp understands -- the string is absent from the binary
# -- so it would be ignored in silence.
gpu_list=0

# System side, to tell VRAM exhaustion apart from plain RAM pressure.
ram
cpu_stats
cpu_temp

position=top-left
font_size=20
background_alpha=0.4
table_columns=2

# Right Shift + F12 toggles the overlay without restarting the game.
toggle_hud=Shift_R+F12

# Start hidden. gs launches mangoapp for every game so that this keybind always
# has something to toggle, and a HUD nobody asked for on top of every game is
# not what you want -- so it comes up invisible and Shift_R+F12 brings it in.
# GS_HUD=1 starts it visible instead.
no_display

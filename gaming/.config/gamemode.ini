# GameMode — https://github.com/FeralInteractive/gamemode
#
# Everything not set here keeps its built-in default: while a game is running
# the CPU governor goes to performance and split_lock_mitigate goes to 0, and
# both revert when the game exits.

[cpu]
# Core pinning OFF. This machine is an i5-13600K: 6 P-cores + 8 E-cores, 20
# threads. With pinning on, gamemode narrows a game's CPU affinity from 0-19 to
# 0-11 -- the P-cores only -- and the mask is inherited by every child process,
# so wrapping a launcher poisons the game it starts.
#
# Elden Ring does not survive it. Wwise fails to initialise and the game panics
# in MoWwiseMan.cpp before it ever opens an audio device, which reads as an
# audio bug and is not one. Baldur's Gate 3 is another known casualty. Upstream
# issue: https://github.com/FeralInteractive/gamemode/issues/497
#
# Pinning is on by default, but bug #451 stopped it from working at all until
# gamemode 1.8.2 -- which is why games only started crashing at that release
# and 1.8.1 looks "fine" by comparison.
pin_cores=no

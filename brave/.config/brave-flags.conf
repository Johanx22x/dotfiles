# Brave is Chromium, and Chromium does not use an input method on Wayland
# unless it is told to. Without this line the browser takes romaji and nothing
# converts it, while every other application on the machine is fine -- which
# is a confusing way to find out, so the line is here rather than waiting to
# be discovered.
#
# THE WRAPPER THAT READS THIS IS /usr/bin/brave, a shell script from brave-bin
# that reads $XDG_CONFIG_HOME/brave-flags.conf and skips blank lines and lines
# starting with #, which is why this comment is safe to leave in place.
#
# IT ONLY DOES ANYTHING IF BRAVE IS ACTUALLY ON WAYLAND. Brave's desktop file
# passes no --ozone-platform, so whether it runs natively or through XWayland
# is Brave's own default and not something this file decides. On XWayland the
# flag is inert and the IME arrives over XIM instead, through
# XMODIFIERS=@im=fcitx in environment.d/20-input-method.conf -- so Japanese
# typing works either way and this line is what makes the native path work
# too. brave://version reports which platform the running browser picked.
#
# THIS FILE IS LINKED WHETHER OR NOT BRAVE IS INSTALLED, the same trade
# packages/optional/apps.txt already describes for Zen's generated stylesheet:
# an unread configuration file costs nothing, and a conditional link costs a
# whole mechanism.
--enable-wayland-ime

#  ~/.config/starship.toml
#
# Minimal single-line style.
# Colours use ANSI names (purple, green, ...) rather than hex, so they follow
# the palette matugen generates for kitty.

# Leaves a blank line before each prompt: it breathes better.
add_newline = true

# Module order. Anything not listed here is not shown.
format = """
$directory\
$git_branch\
$git_status\
$nodejs$python$rust$golang$java$php$ruby$lua$c\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ----------------------------------------------------------------- directory
[directory]
style = "bold cyan"
truncation_length = 3         # show at most 3 levels
truncate_to_repo = true       # inside a repo, the root is the repo
truncation_symbol = "…/"
read_only = "  "
read_only_style = "red"

[directory.substitutions]
"Documentos" = " "
"Descargas" = " "
"Imagenes" = " "
"Escritorio" = " "
"Musica" = " "
"Videos" = " "

# ---------------------------------------------------------------------- git
[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ------------------------------------------------------------------ languages
# They only show up inside a project of that language.
[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold green"

[python]
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
symbol = " "
style = "bold yellow"

[rust]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold cyan"

[java]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

[php]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold blue"

[ruby]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

[lua]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold blue"

[c]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold blue"

[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "
style = "bold blue"

# ------------------------------------------------------------------ duration
[cmd_duration]
min_time = 2000               # only if it took more than 2s
format = "took [$duration]($style) "
style = "bold yellow"

# ------------------------------------------------------------------ character
# Green if the previous command succeeded, red if it failed.
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

# ------------------------------------------------------------------ disabled
[package]
disabled = true               # noisy: the package.json version on every prompt

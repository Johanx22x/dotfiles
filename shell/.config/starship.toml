#  ~/.config/starship.toml
#
# Estilo minimalista de una linea.
# Los colores usan nombres ANSI (purple, green, ...) en vez de hex,
# para que sigan la paleta que matugen genera para kitty.

# Deja una linea en blanco antes de cada prompt: respira mejor.
add_newline = true

# Orden de los modulos. Lo que no aparezca aqui no se muestra.
format = """
$directory\
$git_branch\
$git_status\
$nodejs$python$rust$golang$java$php$ruby$lua$c\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ---------------------------------------------------------------- directorio
[directory]
style = "bold cyan"
truncation_length = 3         # muestra como maximo 3 niveles
truncate_to_repo = true       # dentro de un repo, la raiz es el repo
truncation_symbol = "…/"
read_only = "  "
read_only_style = "red"

[directory.substitutions]
"Documentos" = " "
"Descargas" = " "
"Imagenes" = " "
"Escritorio" = " "
"Musica" = " "
"Videos" = " "

# ---------------------------------------------------------------------- git
[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ------------------------------------------------------------------ lenguajes
# Solo aparecen dentro de un proyecto de ese lenguaje.
[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold green"

[python]
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
symbol = " "
style = "bold yellow"

[rust]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold cyan"

[java]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

[php]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold blue"

[ruby]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

[lua]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold blue"

[c]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold blue"

[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "
style = "bold blue"

# ------------------------------------------------------------------ duracion
[cmd_duration]
min_time = 2000               # solo si tardo mas de 2s
format = "took [$duration]($style) "
style = "bold yellow"

# ------------------------------------------------------------------ caracter
# Verde si el comando anterior salio bien, rojo si fallo.
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"

# ------------------------------------------------------------------ apagados
[package]
disabled = true               # ruidoso: version del package.json en cada prompt

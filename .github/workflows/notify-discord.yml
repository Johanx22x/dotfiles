name: Notify Discord

# Announces merged pull requests in Discord so everyone tracking this repo
# knows there is something new to pull.
#
# `pull_request_target` is used instead of `pull_request` so the job still has
# access to secrets when the pull request comes from a fork. This is only safe
# because the workflow never checks out or runs any code from the pull request:
# it reads event metadata and posts it. Do not add a checkout step here.
on:
  pull_request_target:
    types: [closed]
    branches: [master]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Post the update to Discord
        env:
          # Pull request fields go through the environment, never through `${{ }}`
          # inside the script, so a crafted title cannot inject shell commands.
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg url "$PR_URL" \
            --arg number "$PR_NUMBER" \
            --arg author "$PR_AUTHOR" \
            --arg commits "$PR_COMMITS" \
            --arg files "$PR_CHANGED_FILES" \
            '{
              content: "New dotfiles update is on `master` — run `git pull` to get it.",
              embeds: [{
                title: ("#" + $number + " " + $title),
                url: $url,
                description: (if ($body | length) > 0 then $body[0:1500] else "" end),
                color: 5793266,
                fields: [
                  { name: "Commits", value: $commits, inline: true },
                  { name: "Files changed", value: $files, inline: true }
                ],
                footer: { text: ("merged by " + $author) }
              }]
            }')

          curl --silent --show-error --fail \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK"

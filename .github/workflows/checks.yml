name: Checks

# What runs before a pull request can be merged.
#
# Everything lands here through a pull request, so `pull_request` covers the
# whole repository: there is no other way in. This is the opposite case from
# notify-discord.yml next door -- that one carries secrets and therefore must
# never check out the branch; this one checks out the branch and therefore
# carries no secrets. Do not merge the two.
#
# IN AN ARCH CONTAINER, because what is being checked is an Arch desktop. The
# checks ask the real tools the real questions -- Hyprland whether it accepts
# its own config, niri whether it accepts its own, pacman whether these package
# names exist -- and none of those can be asked on Ubuntu. base-devel rather
# than base for makepkg's dependencies, which is what packages/ is built with.
#
# Every check lives in tests/ as a script that runs on its own, which is
# deliberate: a check that can only be run by pushing a branch is a check
# nobody runs before pushing.
#
# THE TRIGGER HAS NO `branches:` FILTER, AND THE ABSENCE IS THE POINT. It used
# to say `branches: [master]`, which reads as "every pull request" only if
# every pull request is aimed at master. This repository uses stacked pull
# requests -- `gh stack` -- where a pull request's base is the branch below it
# in the stack rather than master, and such a pull request matched no trigger
# at all. Not "ran and passed": never started. Pull requests #58 and #59 merged
# with exactly one check run between them, `notify`, and no `Checks` run of any
# kind on either head commit. A missing check looks the same on the page as a
# check nobody has heard of, which is to say it looks like nothing, and the
# pull request merges green.
#
# WHAT A STACKED PULL REQUEST IS CHECKED AGAINST, since it is no longer master.
# The `pull_request` event builds `refs/pull/N/merge` -- the head merged into
# THAT pull request's base -- and actions/checkout takes that ref by default.
# So the tree these checks see is the branch merged into the one below it,
# which already contains everything below THAT, all the way down to master.
# The whole stack up to and including this pull request, in other words, which
# is both the tree the author is actually proposing and the only tree in which
# a stacked change makes sense on its own. Checking it against master instead
# would mean checking a diff that has never existed.
#
# AND IT DOES NOT DOUBLE ANYTHING. One run per pull request per push, which is
# what there already was; a stack of five is five different trees and therefore
# five different questions, not the same job five times. The obvious-looking
# alternative -- keeping the base filter and adding a `push:` trigger to cover
# the rest -- is what would double it, because a branch with a pull request
# open fires both, and that is the reason there is no `push:` here.
#
# The one thing left unverified is what happens at a restack. GitHub documents
# that "a workflow only runs when a `pull_request` event's activity type is
# `opened`, `synchronize`, or `reopened`", and neither of the two things a
# restack does to a pull request above the one that merged -- retargeting its
# base, force-pushing its head -- is an `opened` or a `reopened`. The
# force-push is a `synchronize` and should re-run, which is correct: the tree
# really did change. The retarget looks like an `edited` and should not, but
# GitHub's own pages list the activity types for this event without saying
# which one a base change belongs to, so that half is read off the meanings and
# not off a document. If a stack is ever seen running twice on one push, the
# retarget is the first place to look.
on:
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      # BEFORE THE CHECKOUT, because actions/checkout falls back to downloading
      # a tarball when git is missing, and a tarball is not a repository:
      # tests/shell-lint.sh finds what to lint with `git ls-files`.
      #
      # lua is not decoration here: the bind check runs hyprland.lua rather
      # than reading it. See tests/hl-stub.lua.
      - name: Install what the checks need
        run: |
          set -euo pipefail

          # MULTILIB, or every lib32-* name in packages/ comes back as a
          # package that exists nowhere. A disabled repository is missing from
          # `pacman -Sl` in exactly the way a non-existent package is, and this
          # desktop needs [multilib] for Steam -- install.sh says the same
          # thing at the point where it has to guess.
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf

          # python-yaml for tests/workflows.py, which reads these workflow
          # files back; actionlint for the same check, which shells out to it
          # for everything about GitHub's schema that a hand-written test has
          # no business reimplementing. Both are in [extra], so the same two
          # names install them on the desktop this repository is for -- which
          # is the difference between a check anybody can run before pushing
          # and one that only CI can answer.
          #
          # quickshell, labwc and mesa are what tests/shell-load.sh needs, and
          # the three of them are one question: can the shell be started. qs is
          # the thing under test; labwc is a compositor that will run without a
          # seat or a GPU, which Hyprland will not (the header there says why);
          # mesa is llvmpipe, because Qt Quick still wants a GL context on a
          # runner that has no card in it. All three are in [extra].
          #
          # python-pyqt6 AND qt6-declarative, BOTH, for tests/wheel-and-click.py.
          # That bench builds a QQuickView of its own and drives the settings
          # rail's real components inside it, so it needs Qt Quick itself and a
          # Python binding to it. NOT COVERED BY quickshell ABOVE: the binding
          # is what lets a test synthesize a wheel event naming a device Qt
          # would never hand it, which is the whole reason the bench exists.
          # And the two names are not one either -- python-pyqt6 declares
          # qt6-base and stops there, while its QtQuick module links
          # libQt6Quick.so.6, libQt6Qml.so.6 and three more that only
          # qt6-declarative ships, so the binding alone gives a container where
          # `import PyQt6.QtQuick` fails and the check dies before its first
          # assertion.
          #
          # matugen for tests/scheme-pinning.sh, and it is the first check here
          # that renders a palette instead of reading one. It is in [extra], it
          # is the same 4.2.0 the desktop runs, and it is what turns "the state
          # file says gruvbox" into "the colour the shell would read is
          # gruvbox's". jq comes with it as a dependency of nothing -- it is
          # pulled in explicitly below, because that check parses the schemes
          # and the manifests with it and `desktop-scheme` reads a label with
          # it on every `list`.
          #
          # NO WALLPAPER AND NO IMAGE DECODER NEEDED: that check seeds the
          # render with `matugen color hex`, the same form `desktop-scheme
          # accent-args` reduces an image to before the render ever runs.
          #
          # NO FONT PACKAGE, checked rather than assumed: that bench was run
          # against an empty fontconfig and passed. Its entries carry Text
          # items, but nothing it measures is a text size -- the rail's height
          # comes from Theme.groupHeight -- so Qt's own fallback is enough and
          # a font package would be weight for nothing.
          pacman -Syu --needed --noconfirm \
            git python python-yaml lua shellcheck actionlint stow hyprland \
            niri curl quickshell labwc mesa python-pyqt6 qt6-declarative \
            matugen jq

      - uses: actions/checkout@v7

      - name: Let git own the checkout
        # The job runs as root inside the container over a directory the runner
        # created outside it. Without this, git refuses every command with
        # "detected dubious ownership" and the shell lint has nothing to lint.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # `!cancelled()` on every check so one failure does not hide the rest. A
      # pull request that broke two things should say both in one run, rather
      # than one per push.
      # FIRST, BECAUSE IT IS THE ONLY CHECK HERE WHOSE FAILURE CANNOT BE
      # UNDONE. Every other one guards against something a later commit fixes:
      # a broken config, a renamed package, a stow collision. A passphrase or a
      # credentialed repository URL merged into a PUBLIC repository is in the
      # history, on GitHub, and in every clone taken since -- and removing it
      # afterwards removes nothing. This is the last moment at which it is
      # still only a diff.
      - name: The backup configuration holds no secret
        if: ${{ !cancelled() }}
        run: tests/backup-secrets.sh

      - name: Keybinds are the same under both compositors
        if: ${{ !cancelled() }}
        run: tests/bind-parity.py

      - name: Both compositors accept their configuration
        if: ${{ !cancelled() }}
        run: tests/config-syntax.sh

      # THE ONE CHECK STANDING BETWEEN A SCHEME FILE AND A DESKTOP THAT CANNOT
      # RE-THEME ITSELF. matugen resolves every role a template names and
      # writes NONE of the eleven files if one is missing, so a scheme that has
      # dropped a role is not a wrong colour, it is no colour at all -- and
      # until the templates stop carrying the base palette as hex literals, an
      # incomplete scheme renders perfectly and says nothing. The header of the
      # script has the rest.
      #
      # No new package: it is Python, which is already installed above for
      # bind-parity.py and workflows.py.
      - name: The schemes fill the colour vocabulary
        if: ${{ !cancelled() }}
        run: tests/scheme-roles.py

      # AND THE ONE THING THE CHECK ABOVE SAYS IT CANNOT SEE: whether the
      # palette actually renders. Its header records that as measured by hand
      # because "that needs matugen and a wallpaper, neither of which a runner
      # has". Half of that has stopped being true -- matugen is in [extra] and
      # is installed above -- and the other half never had to be: `matugen
      # color hex` seeds a render from a colour instead of an image, which is
      # what `desktop-scheme accent-args` reduces every wallpaper to anyway.
      # So this one RENDERS, into a sandbox, and reads the colour back out.
      #
      # WHAT IT IS FOR is the other half of the two keys `desktop-scheme`
      # keeps. `scheme` is what renders and `chosen` is what the person picked;
      # the second exists so that a theme can pin a scheme for as long as it is
      # on and leaving it gives the person theirs back. The header of that
      # script ends "Nothing pins anything today and the keys cost two lines",
      # which is a code path with no caller -- the argument that has kept other
      # things out of this repository. tests/fixtures/theme-probe's manifest
      # now pins gruvbox-dark, and this check enters and leaves it.
      #
      # IT ASSERTS ON THE RENDERED FILE AND NOT ON THE STATE FILE, and it
      # deletes that file before every transition, because the failure worth
      # guarding against here is a step that records a name, renders nothing,
      # and passes against whatever the previous step left on disk. It also
      # runs the same round trip against two deliberately broken copies of
      # `desktop-scheme` and requires both to be caught.
      #
      # IT DOES NOT PROVE THAT THE SHELL PINS ANYTHING, because the shell
      # cannot: nothing reads a manifest's pinned scheme and nothing calls
      # `desktop-scheme pin`. The file says so at length and carries a tripwire
      # that goes red the day that changes.
      - name: A theme that pins a scheme gives the desktop back
        if: ${{ !cancelled() }}
        run: tests/scheme-pinning.sh

      # THE FIRST TWO CHECKS THAT READ quickshell/ AT ALL. Before these, 125
      # files and 40,592 lines of QML -- half the repository, and three
      # quarters of its commits -- were parsed, linted, loaded and run by
      # nothing here: the whole tree could be emptied without turning a single
      # check red. The first starts a headless compositor and asks whether the
      # real shell comes up; the second reads the source for the handful of
      # mistakes that come up perfectly and then do nothing.
      #
      # NEITHER OF THEM WOULD HAVE CAUGHT THE LAST TWO BREAKAGES, and that is
      # worth saying here rather than leaving to be discovered. A rail that
      # scrolled behind its own scrollbar and a dashboard that opened on the
      # wrong screen both loaded cleanly, resolved every name and logged
      # nothing. These are a floor under the tree, not a statement that it
      # works.
      # NOW ONCE PER THEME, AND THE SECOND THEME IS A FIXTURE. It used to start
      # the shell once, on whatever theme Config.qml defaults to, which
      # answered a question about genesis rather than about the tree. It copies
      # the shell tree into a sandbox, drops tests/fixtures/theme-probe/ in as
      # a second theme, and cold-starts the shell on each -- then changes the
      # theme under a running shell and asserts that the surfaces came back and
      # that "Configuration Loaded" was printed exactly once.
      #
      # THAT LAST PHASE NAMES A BUG THAT WAS ALREADY PAID FOR.
      # modules/ThemeSurface.qml's header records that a BoundComponent fixes
      # its source at creation -- "BoundComponent.url cannot be set after
      # creation" -- so the theme changed and THE OLD ONE STAYED ON SCREEN.
      # Found by hand, on a desktop; nothing in tests/ could have found it,
      # because the shell comes up, every name resolves and the six log strings
      # stay silent.
      - name: The shell loads in a headless compositor, on every theme
        if: ${{ !cancelled() }}
        run: tests/shell-load.sh

      # THE OTHER HALF OF THE SAME PROBLEM, and it is the cheap half: a theme
      # is loaded by URL, so a file missing from one is not a load failure at
      # all. themes/genesis/components/README.md is explicit that there is no
      # per-file fallback -- a theme missing components/ToggleRow.qml gets a
      # Loader in Loader.Error and one warning per row, the settings window
      # still opens, and it draws twenty-eight rows of nothing. The step above
      # comes up green on that: none of its six strings is what a Loader that
      # cannot find a file prints.
      #
      # It derives the list of files from the HOST -- shell.qml's ThemeSurface
      # paths and every Themes.surface("...") call site -- rather than keeping
      # one. A hand-written list was the obvious alternative and there is
      # direct evidence against it in this branch: the "Nineteen components"
      # list at the top of themes/genesis/components/README.md was one short
      # before it was a day old, because ScrollBar was split after it was
      # written.
      - name: Every theme implements the whole interface
        if: ${{ !cancelled() }}
        run: tests/theme-interface.py

      # AND IT READS THE THEMES TOO, WHICH IT DID NOT USED TO. It swept
      # quickshell/.config/quickshell and nothing else, so genesis was read
      # because of where it sits and tests/fixtures/theme-probe -- a theme by
      # the same definition, 27 .qml files -- was read by nothing.
      #
      # BOTH ITS RULES HAVE THEIR SUBJECT INSIDE A THEME, which is the evidence
      # that this was the wrong scope rather than merely a narrow one. One of
      # the repository's two WheelHandlers and the ONLY FolderListModel whose
      # rows are read both live in themes/genesis/wallpaper/WallpaperCarousel.qml;
      # move genesis out from under quickshell/ and this step does not lose
      # coverage quietly, it fails with "has the rule outlived its subject?".
      - name: The QML tree keeps to its rules
        if: ${{ !cancelled() }}
        run: tests/qml-rules.sh

      # THE LINTER THAT THE NOTE AT THE BOTTOM OF THIS FILE USED TO SAY COULD
      # NOT EXIST. It could not, while the tree imported through Quickshell's
      # `root:/` scheme: qmllint cannot resolve that, so it could not find a
      # type behind any import and buried the tree under 4,074 warnings, 3,039
      # of them `[unqualified]` and every one of those an import it could not
      # follow rather than a fault in the code.
      #
      # The tree now imports by module name -- `import qs.components` -- which
      # is what Quickshell registers those directories as, and the same sweep is
      # 307. The script builds the qmldirs qmllint needs into a copy under
      # mktemp, because a committed qmldir would turn Quickshell's own
      # synthesis off and become a second place every component has to be
      # registered. It gates per category at what the tree measured rather than
      # at zero, which nobody can reach today.
      #
      # PER SCOPE AS WELL AS PER CATEGORY, AND A THEME IS A SCOPE. It used to
      # hold one total for one directory, so a theme was linted only if it
      # happened to live inside that directory -- genesis did, the fixture did
      # not. That is not an ordinary gap: rule 1 of
      # themes/genesis/components/README.md ("required property <Facade> row",
      # never "property var row") is justified entirely by a measurement taken
      # with this script, and it was being measured on one theme. Three
      # misspelled reads were put into the fixture and the old sweep answered
      # "306 warnings, none of them new" and exited 0.
      #
      # Now a theme is any directory with a manifest.json, it is dropped into
      # the sandbox where genesis already sits so it gets identical qmldirs and
      # identical imports, and it carries its own budget. A theme nobody has
      # budgeted is compared against zero, so a theme added to this repository
      # cannot fold its warnings into a number written about the shell -- it
      # turns the run red under its own name.
      #
      # AND IT WOULD NOT HAVE CAUGHT EITHER OF THIS WEEK'S TWO BREAKAGES, which
      # is measured in the script rather than assumed: with the launcher fix of
      # 279c1d3 reverted the sweep gives 307, and with it in place, 307. It sees
      # names and types, not what any of it does on a screen. The header says so
      # at length, and it belongs there rather than only here.
      - name: The QML tree passes qmllint
        if: ${{ !cancelled() }}
        run: tests/qml-lint.sh

      - name: Shell scripts pass shellcheck
        if: ${{ !cancelled() }}
        run: tests/shell-lint.sh

      - name: Package names resolve
        if: ${{ !cancelled() }}
        run: tests/package-lists.sh

      - name: stow links the tree without conflicts
        if: ${{ !cancelled() }}
        run: tests/stow-conflicts.sh

      # The other half of the same question. stow-conflicts.sh asks whether the
      # packages can be linked into an empty home; this one asks what happens to
      # a link once the file behind it is deleted from the repository, which is
      # what an update does and what nothing here could see until it was
      # measured on the real machine. It builds its own repository and its own
      # home under mktemp -- it is the deletion path, so it goes nowhere near
      # anybody's $HOME -- and stow above is what it needs installed.
      - name: A deleted file leaves no link behind
        if: ${{ !cancelled() }}
        # UNDER A USER OF ITS OWN, because it sources install.sh for `run`, the
        # ui and the unit, and install.sh refuses to be run as root -- with
        # `exit`, which from a sourced script would end the test before its
        # first assertion. This container is root, so the test gets somebody to
        # be: it only reads the checkout and writes into mktemp, so no
        # ownership of anything has to change. The installer job next door
        # solves the same refusal the same way, with its `ci` user.
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash checker
          sudo -u checker -H "$GITHUB_WORKSPACE/tests/stale-links.sh"

      # THE ONE CHECK THAT RUNS QML. Everything above reads files or runs a
      # parser over them; this builds a QQuickView offscreen, puts the settings
      # rail's own ScrollList and SettingsNavItem in it at the window's real
      # 820x580, and sends wheel and mouse events at them by hand.
      #
      # IT IS HERE BECAUSE THE ALTERNATIVE FAILED THREE TIMES. The rail's
      # first-click bug took #144, #155 and #158 to fix, and the middle one
      # shipped a settings window in which nothing scrolled at all -- because
      # every measurement until then had been taken by hand, on a bench that
      # was never committed, and asked only one of the two questions. The file
      # says the rest.
      #
      # NO COMPOSITOR AND NO DISPLAY. The script forces QT_QPA_PLATFORM to
      # offscreen itself; nothing here needs a seat, a Wayland socket or
      # Quickshell. It is the one QML question a container can answer, which is
      # also why it is the only one asked -- see the note on qmllint below.
      - name: The settings rail scrolls, and keeps the click that follows
        if: ${{ !cancelled() }}
        run: tests/wheel-and-click.py

      # THE OTHER HALF OF THE SAME PROBLEM, and it is here for the same
      # reason: the scrollbar's press target is widened past the four pixels
      # it is drawn as, the widening comes out of whatever is beside the bar,
      # and twice it came out of something that wanted the press -- a settings
      # entry that scrolled instead of opening, an application that scrolled
      # instead of launching. Both were found by hand, on the desktop, after
      # shipping. One integer in a diff, nothing to see in a screenshot, and
      # the shell loads perfectly either way; this presses every pixel across
      # each placement and says which item heard it.
      #
      # Offscreen as well, and for the same reason -- see the file.
      - name: The scrollbar takes its own pixels and no others
        if: ${{ !cancelled() }}
        run: tests/scrollbar-target.py

      # LAST, BECAUSE IT IS ABOUT THE OTHER CHECKS RATHER THAN ABOUT THE
      # REPOSITORY. It answers whether the workflows in this directory run at
      # all, whether any of them still filters a `pull_request` by base branch
      # -- the bug that let stacked pull requests merge with no checks -- and
      # whether every executable script in tests/ is named by some workflow. A
      # check nothing runs and a check that never starts look identical from
      # the outside, which is to say they look like nothing.
      - name: The workflows run, and run on every pull request
        if: ${{ !cancelled() }}
        run: tests/workflows.py

      # THE QMLLINT NOTE THAT USED TO SAY THERE COULD BE NO QMLLINT. It is kept
      # rather than deleted, because what it got right is the reason the check
      # above is shaped the way it is, and what it got wrong took one afternoon
      # to disprove.
      #
      # WHAT IT GOT RIGHT, AND STILL IS. /usr/bin/qmllint is Qt 5, from
      # qt5-declarative. It exits 255 and prints NOTHING on any file using a
      # `: var` return type, which is most of this tree -- when it was measured,
      # 49 files passed and 76 failed in total silence. tests/qml-lint.sh names
      # /usr/lib/qt6/bin/qmllint by
      # absolute path for exactly this reason and never takes `qmllint` off the
      # PATH.
      #
      # WHAT IT GOT RIGHT ABOUT THE FIX. It said the answer was "teaching
      # qmllint where Quickshell's imports live, which is work in quickshell/
      # and not work in CI", and that is precisely what happened: the tree was
      # migrated off the `root:/` scheme onto module imports, and the CI side of
      # it is the four lines above.
      #
      # WHAT IT GOT WRONG was how expensive that would be. Quickshell has
      # registered the config root as the module `qs` for a long time, so
      # `import qs.components` is the same directory under a name a linter can
      # resolve, and it synthesizes a qmldir per directory at startup -- which
      # is both the proof that the mapping is well-defined and the specification
      # the script's generator was checked against. The rewrite was mechanical
      # and the sweep went from 4,074 warnings to 326, and to 307 once the
      # cheap half of those was cleared.
      #
      # WHAT REMAINS TRUE OF tests/shell-load.sh, and it is the more important
      # half. It answers a different question rather than a smaller one:
      # qmllint reads files, that check RUNS them, in a compositor, as the shell
      # -- the import resolves for real, the singleton is constructed for real,
      # the binding is evaluated for real. Neither replaces the other, and
      # neither of them sees a layout fault. tests/wheel-and-click.py is still
      # the only thing here that measures what a component DOES.

  # ---------------------------------------------------------------------------
  # THE ONE CHECK THAT RUNS install.sh.
  #
  # Everything in the job above is about the repository's CONTENT: that both
  # compositors accept their configuration, that every package name still
  # resolves, that stow could link the tree. None of it runs the installer. So
  # until this existed, install.sh -- rewritten from a 789-line linear script
  # into a unit-based installer with three modes -- had `check` covered by hand
  # and `apply` covered by nothing at all. It had never been executed for real
  # by anybody, only under --dry-run, which by design does nothing.
  #
  # A SECOND JOB AND NOT A SECOND WORKFLOW. What gates a pull request should be
  # answerable by opening one file, and this has the same trigger and the same
  # purpose as the checks above -- it is not a schedule and it carries no
  # secrets, which is what the other two workflows in this directory are for.
  # A job rather than more steps because jobs run in parallel: a install that
  # takes minutes must not be sat in front of a shellcheck that takes seconds,
  # and because the container needs setting up quite differently.
  #
  # AS A USER AND NOT AS ROOT. The container runs as root, install.sh refuses
  # to run as root by design -- everything it does writes into a home directory
  # and doing that as root leaves files the owner cannot edit -- and it asks
  # for sudo at the moment it needs it. So there is an unprivileged user here
  # with passwordless sudo, which is the shape of the machine this is written
  # for.
  installer:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    # The failure mode of a menu waiting for a key that will never come is a
    # hang, not an error. tests/installer-menus.sh puts a timeout around each
    # of its own, and this is the backstop for everything else -- a real run
    # takes a few minutes.
    timeout-minutes: 25

    steps:
      - name: Install what the installer needs to be run at all
        run: |
          set -euo pipefail

          # MULTILIB, for the same reason the job above enables it: a disabled
          # repository is missing from `pacman -Sl` in exactly the way a
          # package that does not exist is, so without it every lib32-* name
          # is looked for in the AUR. install.sh has a branch that says so in
          # words, and tests/installer-run.sh puts a lib32 package in its
          # substitute list precisely so that branch is not the one taken.
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf

          # DELIBERATELY SHORT. Everything the installer itself needs -- stow,
          # curl, and git for the Neovim clone -- is left out so that the
          # packages unit is the thing that installs them, which is the only
          # way the dependency between it and the units after it is real
          # rather than assumed.
          #
          # gum is here because it is the whole point of half of
          # tests/installer-menus.sh: lib/ui.sh carries two implementations of
          # its tick-box menu, and the gum one has never been run anywhere,
          # because gum is not installed on the machine these dotfiles come
          # from. It is one package in extra. jq is what reads
          # `check --json` back.
          pacman -Syu --needed --noconfirm git jq sudo gum

          # THE UNPRIVILEGED USER. Passwordless because install.sh keeps a
          # sudo timestamp alive for the length of a run rather than asking
          # again halfway through an AUR build, and there is nobody here to
          # type a password into either one.
          useradd --create-home --shell /bin/bash ci
          printf 'ci ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/ci
          chmod 0440 /etc/sudoers.d/ci

      - uses: actions/checkout@v7

      - name: Hand the checkout to that user
        # The runner creates the workspace outside the container and it arrives
        # owned by root. tests/installer-run.sh copies the tree with `cp -a`,
        # which as a non-root user cannot preserve an owner it is not, and
        # fails rather than warning.
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R ci:ci "$GITHUB_WORKSPACE"

      # `!cancelled()` on both, so a pull request that broke the menus and the
      # install says both in one run rather than one per push.
      #
      # INSTALLER_TEST_INSTALL=1 is the test's own safety catch: it runs
      # install.sh for real, and the packages step means sudo and pacman, so it
      # refuses to start anywhere without being told that is wanted.
      - name: install.sh installs, and installs again to no effect
        if: ${{ !cancelled() }}
        run: |
          sudo -u ci -H env INSTALLER_TEST_INSTALL=1 \
            "$GITHUB_WORKSPACE/tests/installer-run.sh"

      - name: Both tick-box menus answer a keyboard
        if: ${{ !cancelled() }}
        run: sudo -u ci -H "$GITHUB_WORKSPACE/tests/installer-menus.sh"

      # ---------------------------------------------------------------------
      # WHAT THIS JOB DOES NOT PROVE, written down here rather than left to be
      # discovered by whoever trusts a green tick.
      #
      # THE REAL PACKAGE LISTS ARE NOT INSTALLED. Well over a hundred required
      # names, four of them AUR builds behind a `yay` that has to compile
      # itself first, is twenty minutes and a red run every time something
      # breaks upstream -- which is a fact about the AUR, not about this
      # repository. tests/package-lists.sh already asks whether every one of
      # those names exists; the run here uses a handful of stand-ins so the
      # question it answers is whether install.sh's own machinery works. The
      # one thing it does build for real is packages/xwayland-satellite/,
      # because that unit has no other way of being tested at all.
      #
      # NOTHING WRITES TO /etc, AND NOTHING IN THE INSTALLER TRIES. There was
      # a unit that wrote system files -- pacman.conf, fstab, the mkinitcpio
      # and grub configuration -- and then offered to run `mkinitcpio -P` and
      # `grub-mkconfig`, none of which a container can say anything useful
      # about: a container's /etc is not the /etc anybody boots, the initramfs
      # would be built for a kernel that is not the running one, and
      # grub-mkconfig would enumerate the runner's disks. It is gone; system/
      # is documentation applied by hand and no unit reads it. What is left
      # here is an assertion that pacman.conf and fstab did not move.
      #
      # services-system is left out for a related reason: it enables system
      # units and writes into /etc, and a container with no running systemd
      # cannot say whether that worked.
      #
      # THE palette UNIT IS NEVER APPLIED. It wants matugen, a wallpaper daemon
      # and a running compositor in order to generate eleven files from an
      # image, and none of the three is here. It is unticked for the same
      # reason the others are, so palette_apply has nothing behind it.
      #
      # NOR IS gpu, which installs a graphics driver: the run must be safe on a
      # real machine as well as in a container, and a driver for a card you do
      # not have is not a harmless mistake. shell is `na` wherever zsh is not in
      # /etc/shells, and its apply is `chsh`, which authenticates through PAM
      # with a password no test has.
      #
      # services-user AND monitors SAY `na` HERE and are not exercised: one
      # needs a running `systemd --user` and the other a compositor to ask over
      # a socket. That is the correct answer for a container and it is also the
      # answer on any machine being set up from a TTY, so what is covered is
      # that they decline cleanly rather than that they work.

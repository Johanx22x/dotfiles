name: Checks

# What runs before a pull request can be merged.
#
# Everything lands here through a pull request, so `pull_request` covers the
# whole repository: there is no other way in. This is the opposite case from
# notify-discord.yml next door -- that one carries secrets and therefore must
# never check out the branch; this one checks out the branch and therefore
# carries no secrets. Do not merge the two.
#
# IN AN ARCH CONTAINER, because what is being checked is an Arch desktop. The
# checks ask the real tools the real questions -- Hyprland whether it accepts
# its own config, niri whether it accepts its own, pacman whether these package
# names exist -- and none of those can be asked on Ubuntu. base-devel rather
# than base for makepkg's dependencies, which is what packages/ is built with.
#
# Every check lives in tests/ as a script that runs on its own, which is
# deliberate: a check that can only be run by pushing a branch is a check
# nobody runs before pushing.
#
# THE TRIGGER HAS NO `branches:` FILTER, AND THE ABSENCE IS THE POINT. It used
# to say `branches: [master]`, which reads as "every pull request" only if
# every pull request is aimed at master. This repository uses stacked pull
# requests -- `gh stack` -- where a pull request's base is the branch below it
# in the stack rather than master, and such a pull request matched no trigger
# at all. Not "ran and passed": never started. Pull requests #58 and #59 merged
# with exactly one check run between them, `notify`, and no `Checks` run of any
# kind on either head commit. A missing check looks the same on the page as a
# check nobody has heard of, which is to say it looks like nothing, and the
# pull request merges green.
#
# WHAT A STACKED PULL REQUEST IS CHECKED AGAINST, since it is no longer master.
# The `pull_request` event builds `refs/pull/N/merge` -- the head merged into
# THAT pull request's base -- and actions/checkout takes that ref by default.
# So the tree these checks see is the branch merged into the one below it,
# which already contains everything below THAT, all the way down to master.
# The whole stack up to and including this pull request, in other words, which
# is both the tree the author is actually proposing and the only tree in which
# a stacked change makes sense on its own. Checking it against master instead
# would mean checking a diff that has never existed.
#
# AND IT DOES NOT DOUBLE ANYTHING. One run per pull request per push, which is
# what there already was; a stack of five is five different trees and therefore
# five different questions, not the same job five times. The obvious-looking
# alternative -- keeping the base filter and adding a `push:` trigger to cover
# the rest -- is what would double it, because a branch with a pull request
# open fires both, and that is the reason there is no `push:` here.
#
# The one thing left unverified is what happens at a restack. GitHub documents
# that "a workflow only runs when a `pull_request` event's activity type is
# `opened`, `synchronize`, or `reopened`", and neither of the two things a
# restack does to a pull request above the one that merged -- retargeting its
# base, force-pushing its head -- is an `opened` or a `reopened`. The
# force-push is a `synchronize` and should re-run, which is correct: the tree
# really did change. The retarget looks like an `edited` and should not, but
# GitHub's own pages list the activity types for this event without saying
# which one a base change belongs to, so that half is read off the meanings and
# not off a document. If a stack is ever seen running twice on one push, the
# retarget is the first place to look.
on:
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      # BEFORE THE CHECKOUT, because actions/checkout falls back to downloading
      # a tarball when git is missing, and a tarball is not a repository:
      # tests/shell-lint.sh finds what to lint with `git ls-files`.
      #
      # lua is not decoration here: the bind check runs hyprland.lua rather
      # than reading it. See tests/hl-stub.lua.
      - name: Install what the checks need
        run: |
          set -euo pipefail

          # MULTILIB, or every lib32-* name in packages/ comes back as a
          # package that exists nowhere. A disabled repository is missing from
          # `pacman -Sl` in exactly the way a non-existent package is, and this
          # desktop needs [multilib] for Steam -- install.sh says the same
          # thing at the point where it has to guess.
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf

          # python-yaml for tests/workflows.py, which reads these workflow
          # files back; actionlint for the same check, which shells out to it
          # for everything about GitHub's schema that a hand-written test has
          # no business reimplementing. Both are in [extra], so the same two
          # names install them on the desktop this repository is for -- which
          # is the difference between a check anybody can run before pushing
          # and one that only CI can answer.
          pacman -Syu --needed --noconfirm \
            git python python-yaml lua shellcheck actionlint stow hyprland \
            niri curl

      - uses: actions/checkout@v7

      - name: Let git own the checkout
        # The job runs as root inside the container over a directory the runner
        # created outside it. Without this, git refuses every command with
        # "detected dubious ownership" and the shell lint has nothing to lint.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # `!cancelled()` on every check so one failure does not hide the rest. A
      # pull request that broke two things should say both in one run, rather
      # than one per push.
      # FIRST, BECAUSE IT IS THE ONLY CHECK HERE WHOSE FAILURE CANNOT BE
      # UNDONE. Every other one guards against something a later commit fixes:
      # a broken config, a renamed package, a stow collision. A passphrase or a
      # credentialed repository URL merged into a PUBLIC repository is in the
      # history, on GitHub, and in every clone taken since -- and removing it
      # afterwards removes nothing. This is the last moment at which it is
      # still only a diff.
      - name: The backup configuration holds no secret
        if: ${{ !cancelled() }}
        run: tests/backup-secrets.sh

      - name: Keybinds are the same under both compositors
        if: ${{ !cancelled() }}
        run: tests/bind-parity.py

      - name: Both compositors accept their configuration
        if: ${{ !cancelled() }}
        run: tests/config-syntax.sh

      - name: Shell scripts pass shellcheck
        if: ${{ !cancelled() }}
        run: tests/shell-lint.sh

      - name: Package names resolve
        if: ${{ !cancelled() }}
        run: tests/package-lists.sh

      - name: stow links the tree without conflicts
        if: ${{ !cancelled() }}
        run: tests/stow-conflicts.sh

      # LAST, BECAUSE IT IS ABOUT THE OTHER CHECKS RATHER THAN ABOUT THE
      # REPOSITORY. It answers whether the workflows in this directory run at
      # all, whether any of them still filters a `pull_request` by base branch
      # -- the bug that let stacked pull requests merge with no checks -- and
      # whether every executable script in tests/ is named by some workflow. A
      # check nothing runs and a check that never starts look identical from
      # the outside, which is to say they look like nothing.
      - name: The workflows run, and run on every pull request
        if: ${{ !cancelled() }}
        run: tests/workflows.py

      # NO QMLLINT, AND NOT FOR WANT OF TRYING. Neither of the two on an Arch
      # system can answer the question:
      #
      #   /usr/bin/qmllint is Qt 5, from qt5-declarative. It exits 255 and
      #   prints NOTHING on any file using a `: var` return type, which is most
      #   of them: sweeping quickshell/ leaves 40 files "clean" and 60 exiting
      #   non-zero with no message at all. It is not analysing them, so a green
      #   run would mean nothing whatsoever.
      #
      #   /usr/lib/qt6/bin/qmllint is the real one, and it cannot resolve
      #   Quickshell's `root:/` import scheme. Every file emits well over a
      #   hundred messages on master -- 109 for the first one tried -- all
      #   about types it cannot find rather than about the code.
      #
      # A baseline comparison against the merge base could be built on top of
      # that: a hundred files' worth of noise wrapped in an arithmetic that
      # goes wrong the first time an import moves. The real fix is teaching
      # qmllint where Quickshell's imports live, which is work in quickshell/
      # and not work in CI. Until then this is left out rather than shipped
      # permanently red, or permanently meaningless.

  # ---------------------------------------------------------------------------
  # THE ONE CHECK THAT RUNS install.sh.
  #
  # Everything in the job above is about the repository's CONTENT: that both
  # compositors accept their configuration, that every package name still
  # resolves, that stow could link the tree. None of it runs the installer. So
  # until this existed, install.sh -- rewritten from a 789-line linear script
  # into a unit-based installer with three modes -- had `check` covered by hand
  # and `apply` covered by nothing at all. It had never been executed for real
  # by anybody, only under --dry-run, which by design does nothing.
  #
  # A SECOND JOB AND NOT A SECOND WORKFLOW. What gates a pull request should be
  # answerable by opening one file, and this has the same trigger and the same
  # purpose as the checks above -- it is not a schedule and it carries no
  # secrets, which is what the other two workflows in this directory are for.
  # A job rather than more steps because jobs run in parallel: a install that
  # takes minutes must not be sat in front of a shellcheck that takes seconds,
  # and because the container needs setting up quite differently.
  #
  # AS A USER AND NOT AS ROOT. The container runs as root, install.sh refuses
  # to run as root by design -- everything it does writes into a home directory
  # and doing that as root leaves files the owner cannot edit -- and it asks
  # for sudo at the moment it needs it. So there is an unprivileged user here
  # with passwordless sudo, which is the shape of the machine this is written
  # for.
  installer:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    # The failure mode of a menu waiting for a key that will never come is a
    # hang, not an error. tests/installer-menus.sh puts a timeout around each
    # of its own, and this is the backstop for everything else -- a real run
    # takes a few minutes.
    timeout-minutes: 25

    steps:
      - name: Install what the installer needs to be run at all
        run: |
          set -euo pipefail

          # MULTILIB, for the same reason the job above enables it: a disabled
          # repository is missing from `pacman -Sl` in exactly the way a
          # package that does not exist is, so without it every lib32-* name
          # is looked for in the AUR. install.sh has a branch that says so in
          # words, and tests/installer-run.sh puts a lib32 package in its
          # substitute list precisely so that branch is not the one taken.
          printf '[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf

          # DELIBERATELY SHORT. Everything the installer itself needs -- stow,
          # curl, and git for the Neovim clone -- is left out so that the
          # packages unit is the thing that installs them, which is the only
          # way the dependency between it and the units after it is real
          # rather than assumed.
          #
          # gum is here because it is the whole point of half of
          # tests/installer-menus.sh: lib/ui.sh carries two implementations of
          # its tick-box menu, and the gum one has never been run anywhere,
          # because gum is not installed on the machine these dotfiles come
          # from. It is one package in extra. jq is what reads
          # `check --json` back.
          pacman -Syu --needed --noconfirm git jq sudo gum

          # THE UNPRIVILEGED USER. Passwordless because install.sh keeps a
          # sudo timestamp alive for the length of a run rather than asking
          # again halfway through an AUR build, and there is nobody here to
          # type a password into either one.
          useradd --create-home --shell /bin/bash ci
          printf 'ci ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/ci
          chmod 0440 /etc/sudoers.d/ci

      - uses: actions/checkout@v7

      - name: Hand the checkout to that user
        # The runner creates the workspace outside the container and it arrives
        # owned by root. tests/installer-run.sh copies the tree with `cp -a`,
        # which as a non-root user cannot preserve an owner it is not, and
        # fails rather than warning.
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R ci:ci "$GITHUB_WORKSPACE"

      # `!cancelled()` on both, so a pull request that broke the menus and the
      # install says both in one run rather than one per push.
      #
      # INSTALLER_TEST_INSTALL=1 is the test's own safety catch: it runs
      # install.sh for real, and the packages step means sudo and pacman, so it
      # refuses to start anywhere without being told that is wanted.
      - name: install.sh installs, and installs again to no effect
        if: ${{ !cancelled() }}
        run: |
          sudo -u ci -H env INSTALLER_TEST_INSTALL=1 \
            "$GITHUB_WORKSPACE/tests/installer-run.sh"

      - name: Both tick-box menus answer a keyboard
        if: ${{ !cancelled() }}
        run: sudo -u ci -H "$GITHUB_WORKSPACE/tests/installer-menus.sh"

      # ---------------------------------------------------------------------
      # WHAT THIS JOB DOES NOT PROVE, written down here rather than left to be
      # discovered by whoever trusts a green tick.
      #
      # THE REAL PACKAGE LISTS ARE NOT INSTALLED. Well over a hundred required
      # names, four of them AUR builds behind a `yay` that has to compile
      # itself first, is twenty minutes and a red run every time something
      # breaks upstream -- which is a fact about the AUR, not about this
      # repository. tests/package-lists.sh already asks whether every one of
      # those names exists; the run here uses a handful of stand-ins so the
      # question it answers is whether install.sh's own machinery works. The
      # one thing it does build for real is packages/xwayland-satellite/,
      # because that unit has no other way of being tested at all.
      #
      # NOTHING WRITES TO /etc, AND NOTHING IN THE INSTALLER TRIES. There was
      # a unit that wrote system files -- pacman.conf, fstab, the mkinitcpio
      # and grub configuration -- and then offered to run `mkinitcpio -P` and
      # `grub-mkconfig`, none of which a container can say anything useful
      # about: a container's /etc is not the /etc anybody boots, the initramfs
      # would be built for a kernel that is not the running one, and
      # grub-mkconfig would enumerate the runner's disks. It is gone; system/
      # is documentation applied by hand and no unit reads it. What is left
      # here is an assertion that pacman.conf and fstab did not move.
      #
      # services-system is left out for a related reason: it enables system
      # units and writes into /etc, and a container with no running systemd
      # cannot say whether that worked.
      #
      # THE palette UNIT IS NEVER APPLIED. It wants matugen, a wallpaper daemon
      # and a running compositor in order to generate eleven files from an
      # image, and none of the three is here. It is unticked for the same
      # reason the others are, so palette_apply has nothing behind it.
      #
      # NOR IS gpu, which installs a graphics driver: the run must be safe on a
      # real machine as well as in a container, and a driver for a card you do
      # not have is not a harmless mistake. shell is `na` wherever zsh is not in
      # /etc/shells, and its apply is `chsh`, which authenticates through PAM
      # with a password no test has.
      #
      # services-user AND monitors SAY `na` HERE and are not exercised: one
      # needs a running `systemd --user` and the other a compositor to ask over
      # a socket. That is the correct answer for a container and it is also the
      # answer on any machine being set up from a TTY, so what is covered is
      # that they decline cleanly rather than that they work.

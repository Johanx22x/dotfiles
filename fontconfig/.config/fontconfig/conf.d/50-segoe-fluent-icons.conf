<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  WHERE THE WINDOWS THEME'S ICONS COME FROM, AND WHY A RULE IS NEEDED AT ALL.

  This shell draws a glyph as text: `text: Icons.power` beside
  `font.family: Theme.fontFamily`. One family therefore has to carry both the
  letters and the icons, which is why Config.qml's own note says a family
  without the glyph set turns the desktop into tofu, and why desktop-font
  refuses any family that is not a JetBrainsMono Nerd Font variant. A Nerd Font
  is a text face with an icon set bolted into the Private Use Area, so it does
  both jobs at once.

  WINDOWS SPLITS THE JOB ACROSS TWO FACES AND NEITHER CAN DO THE OTHER'S.
  Measured against the installed files:

      Segoe UI Variable Static Text   2419 glyphs, no U+E7E8, no PUA icons
      Segoe Fluent Icons              1832 glyphs, NO LATIN 'A' AT ALL

  So the windows theme asks for the text face and lets fontconfig supply the
  icons, which is what fontconfig is for and is not a workaround.

  THE PART THAT MAKES THIS A RULE RATHER THAN A DEFAULT. Nerd Fonts also live
  in the Private Use Area and they overlap Segoe Fluent Icons heavily: of the
  92 codepoints themes/windows/icons.json names, 82 (89%) also exist in
  JetBrainsMono NL Nerd Font. Without this file fontconfig answers U+E7E8 with
  the Nerd Font, so the failure is not a missing glyph. It is A DIFFERENT
  GLYPH THAT LOOKS DELIBERATE: the power button comes out as a stack of coins,
  the wifi arc as a triangle, the volume icon as a domino.

  RENDERED BOTH WAYS UNDER Qt BEFORE THIS FILE WAS WRITTEN, with Segoe Fluent
  Icons and the Nerd Font as controls in the same image. With the rule, the
  test row matched the Segoe control glyph for glyph. Without it, the same row
  matched the NERD FONT control glyph for glyph.

  `contains` and not `eq`: the package installs thirteen families, Static Text,
  Static Display and Static Small each in four extra weights, and all of them
  want the same icon fallback. `append` and not `prepend`: the text face has to
  keep answering for Latin, and it does. Verified in both directions:

      fc-match "Segoe UI Variable Static Text:charset=E7E8" → Segoe Fluent Icons
      fc-match "Segoe UI Variable Static Text:charset=0041" → Segoe UI Variable Static Text

  NOTHING ELSE ON THIS DESKTOP IS AFFECTED. The test is on the family name and
  no other application asks for a Segoe family. Genesis is untouched: it names
  no font at all, so it keeps whatever desktop-font wrote.

  THE CLEANER FIX IS IN THE HOST AND IS NOT THIS. If Theme published an icon
  family separately from its text family, no rule would be needed and a theme
  could say which face draws its glyphs. That is a change at every site that
  draws a glyph, and it is written up as the next step rather than done here.

  A NOTE ON THE DASHES. This file uses → and commas where the rest of the
  repository writes a double hyphen, and that is not a style choice: XML
  forbids two consecutive hyphens anywhere inside a comment. A file that breaks
  that rule is not ignored, it is an error fontconfig prints on every single
  lookup, and this one did until it was read back.
-->

<fontconfig>
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Segoe UI Variable</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Segoe Fluent Icons</string>
    </edit>
  </match>
</fontconfig>

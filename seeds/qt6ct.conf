[Appearance]
# icon_theme=Adwaita and NOT breeze-dark. GTK is already on Adwaita
# (gtk-3.0/settings.ini), and having Qt on a different theme is not just an
# inconsistency between toolkits: everything that asks Qt for an icon by name
# resolves against THIS theme. The tray menus are the visible case --
# blueman's entries ask for bluetooth-symbolic and application-x-addon-symbolic,
# which exist in Adwaita but not in breeze-dark, and Quickshell's icon provider
# answers a missing icon with a magenta chequerboard placeholder rather than
# with nothing. Adwaita, matching GTK, resolves all of them.
#
# The ~ in color_scheme_path is deliberate and it works: qt6ct resolves the
# path itself before handing it to Qt, expanding a leading ~ against $HOME.
# Verified against qt6ct 0.11 by pointing a throwaway config at a scheme file
# under a throwaway $HOME -- the palette came out of it, and moving $HOME
# elsewhere made it stop resolving. A bare $VAR is expanded too; ${VAR} is
# NOT, so do not brace it. That is what keeps this file free of an absolute
# home, which is the whole reason it can be a seed for any machine.
#
# The file it points at does not exist until matugen has run: it is generated
# from the wallpaper by the template in matugen/, not versioned here.
color_scheme_path=~/.config/qt6ct/colors/matugen.conf
custom_palette=true
icon_theme=Adwaita
standard_dialogs=default
style=Fusion

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
dialog_buttons_have_icons=1
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3
